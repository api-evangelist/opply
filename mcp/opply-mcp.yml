notes: Opply publishes a hosted, OAuth-protected MCP server. The root endpoint (/api/v1/mcp/) and per-integration
  endpoints (e.g. /api/v1/mcp/zendesk/, /api/v1/mcp/unleashed/) each advertise their own RFC 9728 protected-resource
  metadata and consent scopes. Tool invocation, tool listing, access-request review, per-user access,
  and an audit log are exposed under /api/v1/mcp/*. The live tool catalog requires an authenticated call
  to /api/v1/mcp/tools/ and is not enumerable anonymously; the endpoints below are the discoverable MCP
  control surface from the public OpenAPI.
