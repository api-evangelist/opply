openapi: 3.0.3
info:
  title: Opply Activity Feed QuoteDispatchAddresses API
  version: 0.0.0
tags:
- name: QuoteDispatchAddresses
paths:
  /api/v1/inquiries/dispatch_address/{id}/:
    get:
      operationId: api_v1_inquiries_dispatch_address_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this quote dispatch address.
        required: true
      tags:
      - QuoteDispatchAddresses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDispatchAddress'
          description: ''
    put:
      operationId: api_v1_inquiries_dispatch_address_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this quote dispatch address.
        required: true
      tags:
      - QuoteDispatchAddresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteDispatchAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteDispatchAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteDispatchAddress'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDispatchAddress'
          description: ''
    patch:
      operationId: api_v1_inquiries_dispatch_address_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this quote dispatch address.
        required: true
      tags:
      - QuoteDispatchAddresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuoteDispatchAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuoteDispatchAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuoteDispatchAddress'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDispatchAddress'
          description: ''
