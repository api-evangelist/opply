      - g
      - mg
      - gals
      - kg
      - L
      - tons
      - oz
      - lbs
      - pcs
      - pt
      - ml
      - boxes
      - pallets
      - tsp
      - tbsp
      - units
      - cases
      - trays
      type: string
      description: '* `fl oz` - Fluid Ounces

        * `g` - Grams

        * `mg` - milligrams

        * `gals` - Gallons

        * `kg` - Kilograms

        * `L` - Liters

        * `tons` - Metric Tons

        * `oz` - Ounces

        * `lbs` - Pounds

        * `pcs` - Pieces

        * `pt` - Pints

        * `ml` - Milliliter

        * `boxes` - Boxes

        * `pallets` - Pallets

        * `tsp` - Teaspoons

        * `tbsp` - Tablespoons

        * `units` - Units

        * `cases` - Cases

        * `trays` - Trays'
    SupplyPriorities:
      type: object
      properties:
        priority_name:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PriorityNameEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        priority_value:
          type: integer
          maximum: 3
          minimum: 1
          nullable: true
          description: Level of priority for the user. 1-higher, 3-lower
    PaginatedDashboardInquiriesForSupplierList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/DashboardInquiriesForSupplier'
    DietRequirementsEnum:
      enum:
      - kosher
      - halal
      - organic
      - vegan
      - vegetarian
      type: string
      description: '* `kosher` - Kosher

        * `halal` - Halal

        * `organic` - Organic

        * `vegan` - Vegan

        * `vegetarian` - Vegetarian'
    InquiryDeclinedResponse:
      type: object
      properties:
        decline_reason:
          type: array
          items:
            $ref: '#/components/schemas/InquiryDeclinedResponseDeclineReasonEnum'
        decline_reason_extended:
          type: string
          nullable: true
      required:
      - decline_reason
    DeliveryAddressForSupplier:
      type: object
      properties:
        town:
          type: string
          nullable: true
          maxLength: 100
        country:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Country'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        postcode:
          type: string
          nullable: true
          maxLength: 100
    AllAndFeaturedQuotesForInquiry:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          maxLength: 255
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,10})?$
        currency:
          $ref: '#/components/schemas/SupportedCurrencies'
        category:
          $ref: '#/components/schemas/QuoteCategory'
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        unit_of_measurement:
          $ref: '#/components/schemas/UnitOfMeasurementEnum'
        lead_time:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: The maximum time a supplier agrees to deliver the product within (days)
        expiry_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/QuoteState'
        samples_status:
          $ref: '#/components/schemas/SamplesStatusEnum'
        samples_delivery_address:
          type: integer
          nullable: true
        samples_feedback:
          type: array
          items:
            $ref: '#/components/schemas/SamplesFeedbackEnum'
          nullable: true
        samples_feedback_comment:
          type: string
        unread_messages_count:
          type: number
          readOnly: true
        has_specs:
          type: boolean
          readOnly: true
        unit_price_no_vat_with_shipping:
          type: string
          readOnly: true
        price_percentage_lower:
          type: string
          readOnly: true
        packaging:
          type: string
        expires_in:
          type: string
          readOnly: true
        total_forecast_volume:
          type: string
          readOnly: true
      required:
      - currency
      - expires_in
      - has_specs
      - lead_time
      - packaging
      - price_percentage_lower
      - product_name
      - quantity
      - total_forecast_volume
      - unit_price_no_vat_with_shipping
      - unread_messages_count
      - uuid
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
