    Inquiry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        state:
          $ref: '#/components/schemas/InquiryState'
        category:
          $ref: '#/components/schemas/InquiryCategory'
        name:
          type: string
          maxLength: 255
        current_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        target_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          $ref: '#/components/schemas/Currencies'
        description:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        unit_of_measurement:
          $ref: '#/components/schemas/UnitOfMeasurementEnum'
        allergen_requirements:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/AllergenRequirementsEnum'
            - $ref: '#/components/schemas/BlankEnum'
        allergen_declaration:
          type: boolean
        dietary_certificate:
          type: boolean
        diet_requirements:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DietRequirementsEnum'
            - $ref: '#/components/schemas/BlankEnum'
        forecast:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ForecastEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        due_date:
          type: string
          format: date
        delivery_address:
          type: integer
          nullable: true
        supplier_countries:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Country'
            - $ref: '#/components/schemas/BlankEnum'
          maxItems: 250
        current_supplier:
          type: string
        published:
          type: string
          format: date-time
          nullable: true
          description: Datetime when the inquiry becomes published. Leave empty to keep it unpublished.
        logo_url:
          type: string
          format: uri
          maxLength: 2048
        is_new:
          type: boolean
          readOnly: true
        article:
          type: string
          format: uuid
          nullable: true
        existing_suppliers:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
          nullable: true
        supply_priorities:
          type: array
          items:
            $ref: '#/components/schemas/SupplyPriorities'
        first_order_delivery_date:
          type: string
          format: date
          nullable: true
        opply_brand_commission:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
        opply_supplier_commission:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
        is_recurring:
          type: boolean
          default: false
        frequency:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/FrequencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        desired_contract_length:
          type: integer
          minimum: 0
          nullable: true
        is_delivery_date_flexible:
          type: boolean
