          additionalProperties: {}
          nullable: true
          readOnly: true
        parent_task_uuid:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        subtasks:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        attachments:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
          description: List of task attachments
        unread_chat_count:
          type: integer
          description: 'Caller''s unread in-app chat count — present only when the queryset was

            annotated (list / `/me`); 0 on retrieve / create responses.'
          readOnly: true
        unread_mention_count:
          type: integer
          description: 'How many of the caller''s unread messages @-mention them — drives the

            red attention badge. Annotated on list / `/me`; 0 elsewhere.'
          readOnly: true
        plan_awaiting_revision:
          type: boolean
          description: 'True while the task waits for plan approval AND the newest

            post-version plan-thread message is human-authored — i.e. a human

            requested changes and the chat-dispatch hook guarantees the agent

            answers, so "action required" attention cues can pause. Mirrors the

            detail panel''s ``awaitingRevision`` derivation (an agent reply — even

            without a revision — hands the turn back). Annotated on list / `/me`;

            False elsewhere.'
          readOnly: true
        status_locked:
          type: boolean
          description: 'True while the DB status is ``waiting_approval`` — server-managed

            by the plan gate. Clients key status-control read-only-ness on THIS

            (not on the rendered ``status``, which is masked to ``in_progress``

            for viewers without decision rights and would otherwise re-enable

            controls whose PATCH the gate rejects).'
          readOnly: true
        recurrence_summary:
          type: object
          nullable: true
          properties:
            uuid:
              type: string
              format: uuid
            is_template:
              type: boolean
            is_enabled:
              type: boolean
            frequency:
              type: string
            interval:
              type: integer
            weekdays:
              type: array
              items:
                type: string
            monthly_mode:
              type: string
            weekday_ordinal:
              type: integer
              nullable: true
            cron_expression:
              type: string
              nullable: true
            starts_at:
              type: string
              format: date-time
              nullable: true
            ends_mode:
              type: string
            ends_on:
              type: string
              format: date
              nullable: true
            ends_after_count:
              type: integer
              nullable: true
            overlap_policy:
              type: string
            next_run_at:
              type: string
              format: date-time
              nullable: true
            last_run_at:
              type: string
              format: date-time
              nullable: true
            occurrences_created:
              type: integer
          readOnly: true
        plan:
          type: object
          nullable: true
          properties:
            uuid:
              type: string
              format: uuid
            version:
              type: integer
            status:
              type: string
              enum:
              - pending_approval
              - approved
              - rejected
              - superseded
            body:
              type: string
            feedback:
              type: string
            approver_kind:
              type: string
              enum:
              - task_participants
              - merchant_of_record
            decided_by_name:
              type: string
              nullable: true
            decided_at:
              type: string
              format: date-time
              nullable: true
            created:
              type: string
              format: date-time
            viewer_can_decide:
              type: boolean
            versions:
              type: array
              items:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                  version:
                    type: integer
                  status:
                    type: string
                    enum:
                    - pending_approval
                    - approved
                    - rejected
                    - superseded
                  body:
                    type: string
                  feedback:
                    type: string
                  approver_kind:
                    type: string
                    enum:
                    - task_participants
                    - merchant_of_record
                  decided_by_name:
                    type: string
                    nullable: true
                  decided_at:
                    type: string
                    format: date-time
                    nullable: true
                  created:
                    type: string
                    format: date-time
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
    TaskRecurrenceOverlapPolicyEnum:
      enum:
      - skip
      - allow
      - replace
      type: string
      description: '* `skip` - Skip

        * `allow` - Allow

        * `replace` - Replace'
    TaskPlanReject:
      type: object
      description: 'Request body for ``POST /tasks/{uuid}/plan/reject/``.


        ``plan_version`` pins the version the user actually reviewed (same

        contract as approve): a revision landing mid-review — possibly with a

        different approver — makes the reject 409 instead of silently killing a

        version the user never saw. Required: rejection is destructive, so a

        stale client failing closed (400 → reload) beats an unpinned reject of

        whichever version happens to be pending.'
      properties:
        feedback:
          type: string
          default: ''
          maxLength: 2000
        plan_version:
          type: integer
          minimum: 1
      required:
      - plan_version
    TaskRecurrenceMonthlyModeEnum:
      enum:
      - day_of_month
      - nth_weekday
      type: string
      description: '* `day_of_month` - Day of month

        * `nth_weekday` - Nth weekday'
    TaskAttachmentFileRef:
      type: object
      description: 'Stable handle the agent feeds to ``get_file`` MCP tool.


        Same uuid as ``TaskAttachment.uuid``; the dedicated nested type just

        keeps the generated FE schema strongly-typed (otherwise drf-spectacular

        falls back to ``additionalProperties: {}`` on the parent serializer).'
      properties:
        uuid:
          type: string
          format: uuid
      required:
      - uuid
    BlankEnum:
      enum:
      - ''
    TaskPlanApproverKindEnum:
      enum:
      - task_participants
      - merchant_of_record
      type: string
      description: '* `task_participants` - Task Participants

        * `merchant_of_record` - Merchant of Record'
    MessageWrite:
      type: object
      description: Validates chat message create input. The viewset drives the write.
      properties:
        task_uuid:
          type: string
          format: uuid
          writeOnly: true
        body:
          type: string
          writeOnly: true
        mentioned_user_uuids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
          maxItems: 50
        attachment_uuids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
          maxItems: 100
        add_nonparticipant_watchers:
          type: boolean
          writeOnly: true
          default: false
        thread:
          allOf:
          - $ref: '#/components/schemas/ChatThreadEnum'
          writeOnly: true
          default: main
      required:
      - body
    TaskStatusEnum:
      enum:
      - open
      - in_progress
      - waiting_approval
      - done
      type: string
      description: '* `open` - Open

        * `in_progress` - In Progress

        * `waiting_approval` - Waiting Approval

        * `done` - Done'
    RelatedTarget:
      type: object
      description: 'A single hit in the task "Related to" search — an order, supplier, buyer,

        contract, ingredient or another task the caller can link a task to. (`buyer`

        is only emitted for Merchant-of-Record callers.)'
      properties:
        type:
          $ref: '#/components/schemas/RelatedTargetTypeEnum'
        uuid:
          type: string
          format: uuid
        id_label:
          type: string
          nullable: true
        name:
          type: string
        sub:
          type: string
          nullable: true
      required:
      - id_label
      - name
      - sub
      - type
      - uuid
    TaskPlan:
      type: object
      description: 'Read shape of one plan version for the task envelope + decision responses.


        Deliberately author-less: the plan is presented as authored by the task''s

        assignee, which every surface already renders masked ("Opply") on a

        MoR-routed task — exposing the authoring run/agent here would re-open the

        masking problem for zero FE value. ``decided_by_name`` follows the routed

        masking rules: a ``merchant_of_record`` plan is decided by an MoR-side

        human, so a buyer-side reader sees "Opply", never the individual

        (``task_participants`` deciders are the task''s own participants — no mask

        needed). Pass ``task`` (and ``request``) in the context to enable the

        mask without a per-plan ``plan.task`` re-fetch.'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: 1-based, monotonic per task. A revision after chat feedback is version + 1.
        status:
          allOf:
          - $ref: '#/components/schemas/TaskPlanStatusEnum'
          readOnly: true
          description: 'Approval lifecycle of this version. Only server-side plan endpoints transition it.


            * `pending_approval` - Pending Approval

            * `approved` - Approved

            * `rejected` - Rejected

            * `superseded` - Superseded'
        body:
          type: string
          readOnly: true
          description: The plan itself, as agent-authored markdown. Rendered directly by the FE Plan tab.
        feedback:
          type: string
          readOnly: true
          description: Optional human feedback recorded with a reject decision.
        approver_kind:
          allOf:
          - $ref: '#/components/schemas/TaskPlanApproverKindEnum'
          readOnly: true
          description: 'Who holds decision rights over this version: the task''s participants (creator + human watchers — the default) or the Merchant of Record (the buyer''s account manager, falling back to MoR admins). Stamped at submission from the agent''s declaration; only honored on MoR-routed tasks.


            * `task_participants` - Task Participants

            * `merchant_of_record` - Merchant of Record'
        decided_by_name:
          type: string
          nullable: true
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the approve/reject decision was made. Null while pending / when superseded.
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - approver_kind
      - body
      - created
      - decided_at
      - decided_by_name
      - feedback
      - status
      - uuid
      - version
    TaskPlanApprove:
      type: object
      description: 'Request body for ``POST /tasks/{uuid}/plan/approve/``.


        ``plan_version`` pins the version the user actually reviewed — a revision

        landing mid-review makes the approve 409 instead of silently committing a

        plan the user never saw.'
      properties:
        plan_version:
          type: integer
          minimum: 1
      required:
      - plan_version
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
