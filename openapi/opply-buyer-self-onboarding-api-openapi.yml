          default: OTHER
        type_hint:
          type: string
          nullable: true
          default: ''
          maxLength: 64
        title:
          type: string
          maxLength: 255
        holder_name:
          type: string
          nullable: true
          default: ''
          maxLength: 255
        issuing_authority:
          type: string
          nullable: true
          default: ''
          maxLength: 255
        jurisdiction:
          type: string
          nullable: true
          default: ''
          maxLength: 128
        us_state:
          type: string
          nullable: true
          default: ''
          maxLength: 2
        country:
          type: string
          nullable: true
          default: ''
          maxLength: 2
        certificate_number:
