      description: '* `valid` - Valid

        * `expired` - Expired

        * `expiring_soon` - Expiring Soon

        * `renewed` - Renewed'
    PriorityEnum:
      enum:
      - high
      - medium
      - low
      type: string
      description: '* `high` - High

        * `medium` - Medium

        * `low` - Low'
    MatchConfidenceEnum:
      enum:
      - exact
      - fuzzy
      type: string
      description: '* `exact` - exact

        * `fuzzy` - fuzzy'
    PaginatedBuyerOnboardingSupplierSubmissionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/BuyerOnboardingSupplierSubmission'
    OnboardingExtraction:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        batch_uuid:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OnboardingExtractionStatusEnum'
          readOnly: true
        proposed_business_profile:
          readOnly: true
          description: Aggregate company-profile fields (name, VAT, registered address).
        proposed_banking:
          readOnly: true
          description: Aggregate banking fields the agent extracted (e.g. IBAN).
        proposed_delivery:
          readOnly: true
          description: Delivery addresses inferred from invoice headers.
        agent_reasoning:
          type: string
          readOnly: true
          description: Tweet-length human-readable summary from the orchestrator.
        extraction_session_id:
          type: string
          readOnly: true
          description: AgentCore session id; correlates back to the originating run.
        suppliers:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedSupplierRead'
          readOnly: true
        compliance_documents:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedComplianceDocumentRead'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_reasoning
      - batch_uuid
      - compliance_documents
      - created_at
      - extraction_session_id
      - modified_at
      - proposed_banking
      - proposed_business_profile
      - proposed_delivery
      - status
      - suppliers
      - uuid
    OnboardingExtractionStatusEnum:
      enum:
      - staged
      - reviewed
      - partially_committed
      - committed
      - discarded
      type: string
      description: '* `staged` - Staged

        * `reviewed` - Reviewed

        * `partially_committed` - Partially committed

        * `committed` - Committed

        * `discarded` - Discarded'
    _LineItemWrite:
      type: object
      description: Inline write shape for line items inside a proposal payload.
      properties:
        source_invoice_uuid:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          default: ''
          maxLength: 2000
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          nullable: true
        unit:
          type: string
          default: ''
          maxLength: 32
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          nullable: true
        currency:
          type: string
          default: ''
          maxLength: 8
        classification:
          allOf:
          - $ref: '#/components/schemas/LineItemClassificationEnum'
          default: OTHER
        confidence:
          allOf:
          - $ref: '#/components/schemas/ExtractionConfidenceEnum'
          default: medium
      required:
      - name
    DocumentType:
      type: object
      description: Shared serializer for the DocumentType taxonomy (buyer, supplier, Opply documents).
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
      required:
      - name
      - uuid
    DeliveryAddressMatchPreviewRequest:
      type: object
      description: 'Batch of connector-discovered delivery addresses to check against the

        buyer''s existing saved delivery addresses, for the import review preview.'
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAddressPreviewItem'
      required:
      - addresses
    SupplierMatchResult:
      type: object
      description: 'One preview result. `matched` is true for a supplier the buyer already

        has in ANY state — `source` says which: `onboarded` (sources from it),

        `in_progress` (being onboarded), or `submitted` (pending review). Graph

        matches the buyer doesn''t have at all are the MoR''s concern, never here.

        `company_uuid` is set only for `onboarded` (the others aren''t Companies yet).'
      properties:
        supplier_name:
          type: string
        matched:
          type: boolean
        confidence:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/MatchConfidenceEnum'
          - $ref: '#/components/schemas/NullEnum'
        source:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SupplierMatchResultSourceEnum'
          - $ref: '#/components/schemas/NullEnum'
        company_uuid:
          type: string
          format: uuid
          nullable: true
        company_name:
          type: string
          nullable: true
        ratio:
          type: number
          format: double
          nullable: true
      required:
      - matched
      - supplier_name
    BuyerOnboardingSupplierSubmissionRequest:
      type: object
      description: 'Request-only schema for creating a supplier submission — writable fields

        only. Without it the create''s OpenAPI request body reuses the read component

        and demands response-only fields (`id`, `review_status`,

        `matched_supplier_name`). The viewset still validates/creates through

        :class:`OnboardingSupplierSerializer`; this exists purely so

        ``@extend_schema(request=...)`` emits an honest request contract (its fields

        are a subset the read serializer also accepts, so runtime and schema agree).'
      properties:
        supplier_name:
          type: string
          description: Supplier name
          maxLength: 255
        vat_number:
          type: string
          description: Supplier VAT / tax registration number
          maxLength: 64
        registration_number:
          type: string
          description: Business/company registration number (e.g. Companies House number; Xero's Contact.CompanyNumber) — distinct from the VAT number.
          maxLength: 64
        duns:
          type: string
          description: DUNS number (Dun & Bradstreet identifier), primarily for US suppliers.
          maxLength: 50
        products_description:
          type: string
          description: Description of products purchased from this supplier
        average_monthly_spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Average monthly spend with this supplier
        invoice_currency:
          type: string
          description: Invoice/Payment currency (e.g., USD, GBP, EUR)
          maxLength: 3
        payment_terms:
          type: string
          description: Supplier payment terms
        priority:
          description: 'Priority to onboard this supplier


            * `high` - High

            * `medium` - Medium

            * `low` - Low'
          oneOf:
          - $ref: '#/components/schemas/PriorityEnum'
          - $ref: '#/components/schemas/BlankEnum'
        supplier_country:
          type: string
          description: Supplier country
          maxLength: 100
        supplier_state:
          type: string
          title: Supplier State/County
          description: Supplier state or county
          maxLength: 100
        supplier_address:
          type: string
          description: Supplier address
        contact_name:
          type: string
          description: Supplier contact name
          maxLength: 255
        contact_email:
          type: string
          format: email
          description: Supplier contact email
          maxLength: 255
        contact_phone:
          type: string
          description: Supplier contact phone number
          maxLength: 50
        arranges_delivery:
          type: boolean
          description: Does the supplier arrange delivery?
        lead_time:
          type: string
          description: Agreed lead time
          maxLength: 255
        is_organic:
          type: boolean
          description: Is this an organic supplier?
        relationship_notes:
          type: string
          description: Any noteworthy information about your trading relationship
        notes:
          type: string
          description: Additional notes about the supplier
        provider:
          type: string
          writeOnly: true
        provider_external_id:
          type: string
          writeOnly: true
          maxLength: 128
        confirmed_existing_supplier_uuid:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
      required:
      - supplier_name
    OnboardingInvoiceStatusEnum:
      enum:
      - uploaded
      - agent_extracted
      - agent_extraction_failed
      - discarded
      type: string
      description: '* `uploaded` - Uploaded

        * `agent_extracted` - Agent extracted

        * `agent_extraction_failed` - Agent extraction failed

        * `discarded` - Discarded'
    OnboardingExtractionWrite:
      type: object
      description: 'Body of ``POST /onboarding-extractions/``.


        **Partial staging**: only the sections present in the payload are

        (re-)staged — a present section replaces the previous staging

        destructively (an explicit ``[]`` wipes it), while an absent key

        leaves the previously staged rows untouched. This lets the

        compliance-commit step stage ``compliance_documents`` alone without

        wiping staged suppliers or the proposed_* sections. No field carries

        a ``default`` for exactly this reason — absent must stay

        distinguishable from explicitly empty. The viewset enforces that

        ``batch_uuid`` belongs to ``request.user_company``.'
      properties:
        batch_uuid:
          type: string
          format: uuid
        proposed_business_profile:
          type: object
          additionalProperties: {}
        proposed_banking:
          type: object
          additionalProperties: {}
        proposed_delivery:
          type: array
          items:
            type: object
            additionalProperties: {}
        agent_reasoning:
          type: string
          maxLength: 2000
        extraction_session_id:
          type: string
          maxLength: 64
        suppliers:
          type: array
          items:
            $ref: '#/components/schemas/_SupplierWrite'
        compliance_documents:
          type: array
          items:
            $ref: '#/components/schemas/_ComplianceDocumentWrite'
      required:
      - batch_uuid
