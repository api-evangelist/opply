        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingExtraction'
    BuyerFinancialDocumentTypeEnum:
      enum:
      - management_accounts
      - audited_accounts
      - balance_sheet
      - profit_and_loss
      - cashflow_forecast
      - sales_tax_exemption
      - other
      type: string
      description: '* `management_accounts` - Management Accounts

        * `audited_accounts` - Audited Accounts

        * `balance_sheet` - Balance Sheet

        * `profit_and_loss` - Profit and Loss

        * `cashflow_forecast` - Cashflow Forecast

        * `sales_tax_exemption` - Sales Tax Exemption

        * `other` - Other'
    DeliveryAddressMatchPreviewResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAddressMatchResult'
      required:
      - matches
    ItemMatchResult:
      type: object
      description: 'One item preview result. Unlike suppliers there''s no relationship nuance —

        the buyer''s whole catalogue is fair game. An exact match will merge at commit

        (update_or_create on the name); a fuzzy match is a hint the buyer confirms.'
      properties:
        item_name:
          type: string
        matched:
          type: boolean
        confidence:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/MatchConfidenceEnum'
          - $ref: '#/components/schemas/NullEnum'
        matched_item_uuid:
          type: string
          format: uuid
          nullable: true
        matched_item_name:
          type: string
          nullable: true
        ratio:
          type: number
          format: double
          nullable: true
      required:
      - item_name
      - matched
    SupplierMatchPreviewRequest:
      type: object
      description: 'Batch of connector-discovered supplier names to check against the

        suppliers the buyer already sources from, for the import review preview.'
      properties:
        supplier_names:
          type: array
          items:
            type: string
            maxLength: 255
          description: Discovered supplier names to check for a match against the buyer's existing suppliers.
          maxItems: 200
      required:
      - supplier_names
    SupplierReviewStatusEnum:
      enum:
      - pending_review
      - matched
      - onboarding
      - rejected
      type: string
      description: '* `pending_review` - Pending review

        * `matched` - Matched to existing supplier

        * `onboarding` - Onboarding new supplier

        * `rejected` - Rejected'
    LineItemClassificationEnum:
      enum:
      - INGREDIENT
      - PACKAGING
      - LOGISTICS
      - SERVICES
      - OTHER
      type: string
      description: '* `INGREDIENT` - Ingredient

        * `PACKAGING` - Packaging

        * `LOGISTICS` - Logistics

        * `SERVICES` - Services

        * `OTHER` - Other'
    ItemMatchPreviewResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/ItemMatchResult'
      required:
      - matches
    CatalogItemKindEnum:
      enum:
      - ingredient
      - packaging
      type: string
      description: '* `ingredient` - Ingredient

        * `packaging` - Packaging'
    ExtractedSupplierRead:
      type: object
      description: Nested read shape for ``OnboardingExtractionSerializer``.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        source_invoice_uuid:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        supplier_name:
          type: string
          readOnly: true
        vat_number:
          type: string
          readOnly: true
        registration_number:
          type: string
          readOnly: true
          description: Business/company registration number — distinct from the VAT number.
        address:
          type: string
          readOnly: true
        contact_name:
          type: string
          readOnly: true
        contact_email:
          type: string
          format: email
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
        payment_terms:
          type: string
          readOnly: true
        invoice_currency:
          type: string
          readOnly: true
        average_monthly_spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        lead_time_days:
          type: integer
          readOnly: true
          nullable: true
        supplier_country:
          type: string
          readOnly: true
          description: Free-text country label; ISO-3166 alpha-2 preferred.
        confidence:
          allOf:
          - $ref: '#/components/schemas/ExtractionConfidenceEnum'
          readOnly: true
        evidence:
          type: string
          readOnly: true
          description: Verbatim snippet from the source document (capped at 300 chars by the serializer).
        gaps:
          readOnly: true
          description: List of {field, kind, reason} dicts for missing/unclear fields.
        matched_existing_supplier_id:
          type: integer
          readOnly: true
          nullable: true
          description: If the buyer's network already has this supplier, the matching Company.id.
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedLineItem'
          readOnly: true
      required:
      - address
      - average_monthly_spend
      - confidence
      - contact_email
      - contact_name
      - contact_phone
      - evidence
      - gaps
      - invoice_currency
      - lead_time_days
      - line_items
      - matched_existing_supplier_id
      - payment_terms
      - registration_number
      - source_invoice_uuid
      - supplier_country
      - supplier_name
      - uuid
      - vat_number
    SupplierMatchPreviewResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/SupplierMatchResult'
      required:
      - matches
    OnboardingInvoiceContent:
      type: object
      description: 'Body of ``GET /onboarding-invoices/{uuid}/content/``.


        ``signed_url`` is short-TTL and tied to a single object. Mirrors

        the shape the agent proxy will forward inside its payload.'
      properties:
        signed_url:
          type: string
          format: uri
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        page_count:
          type: integer
          readOnly: true
        expires_in_seconds:
          type: integer
          readOnly: true
      required:
      - expires_in_seconds
      - mime_type
      - page_count
      - signed_url
      - size_bytes
    DeliveryAddressPreviewItem:
      type: object
      description: 'One discovered delivery address to check against the buyer''s saved ones.

        Only the signature fields are needed (street + town + postcode + country).'
      properties:
        street_1:
          type: string
          nullable: true
          maxLength: 255
        town:
          type: string
          nullable: true
          maxLength: 255
        postcode:
          type: string
          nullable: true
          maxLength: 64
        country:
          type: string
          nullable: true
          maxLength: 64
    BuyerOnboardingSupplierSubmission:
      type: object
      description: 'Buyer Suppliers section. The agent commit POSTs one row per extracted

        supplier; only `supplier_name` is required. Backed by the

        `buyer_onboarding.Supplier` model — the MoR review queue reads from

        the same table.


        `review_status` and `matched_supplier_name` are surfaced read-only so

        the buyer can see whether each submission is still pending review,

        has been matched to an existing supplier, or is being onboarded by

        their MoR.'
      properties:
        id:
          type: integer
          readOnly: true
        supplier_name:
          type: string
          description: Supplier name
          maxLength: 255
        vat_number:
          type: string
          description: Supplier VAT / tax registration number
          maxLength: 64
        registration_number:
          type: string
          description: Business/company registration number (e.g. Companies House number; Xero's Contact.CompanyNumber) — distinct from the VAT number.
          maxLength: 64
        duns:
          type: string
          description: DUNS number (Dun & Bradstreet identifier), primarily for US suppliers.
          maxLength: 50
        products_description:
          type: string
          description: Description of products purchased from this supplier
        average_monthly_spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Average monthly spend with this supplier
        invoice_currency:
          type: string
          description: Invoice/Payment currency (e.g., USD, GBP, EUR)
          maxLength: 3
        payment_terms:
          type: string
          description: Supplier payment terms
        priority:
          description: 'Priority to onboard this supplier


            * `high` - High

            * `medium` - Medium

            * `low` - Low'
          oneOf:
          - $ref: '#/components/schemas/PriorityEnum'
          - $ref: '#/components/schemas/BlankEnum'
        supplier_country:
          type: string
          description: Supplier country
          maxLength: 100
        supplier_state:
          type: string
          title: Supplier State/County
          description: Supplier state or county
          maxLength: 100
        supplier_address:
          type: string
          description: Supplier address
        contact_name:
          type: string
          description: Supplier contact name
          maxLength: 255
        contact_email:
          type: string
          format: email
          description: Supplier contact email
          maxLength: 255
        contact_phone:
          type: string
          description: Supplier contact phone number
          maxLength: 50
        arranges_delivery:
          type: boolean
          description: Does the supplier arrange delivery?
        lead_time:
          type: string
          description: Agreed lead time
          maxLength: 255
        is_organic:
          type: boolean
          description: Is this an organic supplier?
        relationship_notes:
          type: string
          description: Any noteworthy information about your trading relationship
        notes:
          type: string
          description: Additional notes about the supplier
        review_status:
          allOf:
          - $ref: '#/components/schemas/SupplierReviewStatusEnum'
          readOnly: true
          description: 'Where this submission sits in the MoR review queue.


            * `pending_review` - Pending review

            * `matched` - Matched to existing supplier

            * `onboarding` - Onboarding new supplier

            * `rejected` - Rejected'
        matched_supplier_name:
          type: string
          readOnly: true
        provider:
          type: string
          writeOnly: true
        provider_external_id:
          type: string
          writeOnly: true
          maxLength: 128
        confirmed_existing_supplier_uuid:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
      required:
      - id
      - matched_supplier_name
      - review_status
      - supplier_name
    _ComplianceDocumentWrite:
      type: object
      description: 'Inline write shape for a compliance document inside a proposal

        payload. Mirrors ``ExtractedComplianceDocumentProposal`` in

        ``@opply/agent-protocol`` — every optional string accepts ``null``

        (the agent''s "couldn''t read it" value) and stores ``""``.'
      properties:
        uuid:
          type: string
          format: uuid
          nullable: true
        source_invoice_uuid:
          type: string
          format: uuid
          nullable: true
        compliance_type:
          allOf:
