      - country
      - email
      - legal_entity_type
      - name
    OnboardingInvoiceUpload:
      type: object
      description: 'Multipart input for ``POST /onboarding-invoices/``.


        Validation of the file''s bytes (MIME sniff, size cap, batch caps)

        is performed in the viewset because it depends on the batch''s

        current totals.'
      properties:
        batch_uuid:
          type: string
          format: uuid
          writeOnly: true
        file:
          type: string
          format: uri
          writeOnly: true
      required:
      - batch_uuid
      - file
  securitySchemes:
    cookieAuth:
      type: apiKey
