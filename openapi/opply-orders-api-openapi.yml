    DeliveryAddressResponse:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 255
        street_1:
          type: string
          nullable: true
          maxLength: 100
        street_2:
          type: string
          nullable: true
          maxLength: 100
        postcode:
          type: string
          nullable: true
          maxLength: 100
        town:
          type: string
          nullable: true
          maxLength: 100
        region:
          type: string
          nullable: true
          maxLength: 100
        country:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Country'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        delivery_instructions:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        phone_country_code:
          type: string
          nullable: true
        contact_full_name:
          type: string
          nullable: true
      required:
      - uuid
    OrderConfirmDelivered:
      type: object
      properties:
        quote_uuid:
          type: string
          format: uuid
        delivered_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        converted_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        unit_of_measurement:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/UnitOfMeasurementEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - delivered_quantity
      - quote_uuid
    PurchaseOrderShipping:
      type: object
      properties:
        delivery_date:
          type: string
          format: date
        delivery_address:
          type: string
        contact_full_name:
          type: string
          nullable: true
        contact_phone_number:
          type: string
          nullable: true
        eori_number:
          type: string
          nullable: true
        delivery_instructions:
          type: string
          nullable: true
        delivery_contact:
          type: string
          nullable: true
      required:
      - contact_full_name
      - contact_phone_number
      - delivery_address
      - delivery_contact
      - delivery_date
      - delivery_instructions
      - eori_number
    BankAccount:
      type: object
      properties:
        beneficiary_name:
          type: string
        address:
          type: string
        sort_code:
          type: string
          nullable: true
        account_no:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
        aba_routing_number:
          type: string
          nullable: true
        account_type:
          type: string
          nullable: true
      required:
      - address
      - beneficiary_name
