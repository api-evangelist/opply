components:
  schemas:
    QuoteState:
      enum:
      - available
      - ordered
      - expired
      - declined
      - pending_payment
      - proceeded
      - contract_created
      - contract_proceeded
      - contract_confirmed
      type: string
      description: '* `available` - available

        * `ordered` - ordered

        * `expired` - expired

        * `declined` - declined

        * `pending_payment` - pending_payment

        * `proceeded` - proceeded

        * `contract_created` - Contract Created

