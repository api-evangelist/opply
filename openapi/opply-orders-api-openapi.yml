          application/json:
            schema:
              $ref: '#/components/schemas/OrderDispute'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderDispute'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderDispute'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
