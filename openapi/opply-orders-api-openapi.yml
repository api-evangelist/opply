          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderDispute'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderDispute'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderDispute'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDispute'
          description: ''
    delete:
      operationId: api_v1_orders_brand_disputes_destroy
      summary: Endpoints for Order Disputes for Brand
      parameters:
      - in: path
        name: dispute_uuid
        schema:
          type: string
        required: true
      - in: path
