openapi: 3.0.3
info:
  title: Opply Activity Feed Orders API
  version: 0.0.0
tags:
- name: Orders
paths:
  /api/v1/orders/brand/:
    get:
      operationId: api_v1_orders_brand_list
      summary: List of orders
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - regular
        description: '* `regular` - Regular'
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: order_type
        schema:
          type: string
          enum:
          - non_recurring
          - purchase_request_quote
          - recurring
        description: '* `non_recurring` - Non Recurring

          * `recurring` - Recurring

          * `purchase_request_quote` - Purchase Request Quote'
      - in: query
        name: ordering
        schema:
          type: string
        description: Supports sorting by created delivery_confirmation_date paid_date shipment_status payment_status latest_delivery_date. Use - to filter backwards
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_status
        schema:
          type: string
        description: 'Supported status: paid payment_upcoming payment_processing payment_due.'
      - in: query
        name: search_filter
        schema:
          type: string
        description: icontains filtering on related inquiry name field.
      - in: query
        name: shipment_status
        schema:
          type: string
        description: 'Supported status: pending_dispatch dispatched delivered.'
      tags:
      - Orders
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
    post:
      operationId: api_v1_orders_brand_create
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateSwagger'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreateSwagger'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreateSwagger'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateSwagger'
          description: ''
  /api/v1/orders/brand/{order_uuid}/:
    get:
      operationId: api_v1_orders_brand_retrieve
      summary: Retrieve details of an orders for a brand
      parameters:
      - in: path
        name: order_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Orders
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/brand/{order_uuid}/confirm-delivered/:
    post:
      operationId: api_v1_orders_brand_confirm_delivered_create
      parameters:
      - in: path
        name: order_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrderConfirmDelivered'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrderConfirmDelivered'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrderConfirmDelivered'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/brand/{order_uuid}/disputes/:
    get:
      operationId: api_v1_orders_brand_disputes_list
      summary: Endpoints for Order Disputes for Brand
      parameters:
      - in: path
        name: order_uuid
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Orders
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderDisputeList'
          description: ''
    post:
      operationId: api_v1_orders_brand_disputes_create
      summary: Endpoints for Order Disputes for Brand
      parameters:
      - in: path
        name: order_uuid
        schema:
          type: string
        required: true
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDisputeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderDisputeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderDisputeRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDispute'
          description: ''
  /api/v1/orders/brand/{order_uuid}/disputes/{dispute_uuid}/:
    get:
      operationId: api_v1_orders_brand_disputes_retrieve
      summary: Endpoints for Order Disputes for Brand
      parameters:
      - in: path
        name: dispute_uuid
        schema:
          type: string
        required: true
      - in: path
        name: order_uuid
        schema:
          type: string
        required: true
      tags:
      - Orders
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDispute'
          description: ''
    put:
