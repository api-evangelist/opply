    OrderDetail:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        category:
          $ref: '#/components/schemas/OrderCategory'
        state:
          $ref: '#/components/schemas/OrderState'
        payment_status:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        kriya_status:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/KriyaStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        payment_currency:
          nullable: true
          description: 'if this is not None, then during payment was chosen not default currency and this field should be passed to the payment as selected_currency


            * `EUR` - EUR

            * `USD` - USD

            * `GBP` - GBP

            * `CAD` - CAD'
          oneOf:
          - $ref: '#/components/schemas/Currencies'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        payment_due_date:
          type: string
          format: date-time
          nullable: true
        kriya_payment_due_date:
          type: string
          format: date-time
          nullable: true
        payment_method:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PaymentMethod'
          - $ref: '#/components/schemas/NullEnum'
        payment_scenario:
          type: string
          readOnly: true
        shipment_status:
          $ref: '#/components/schemas/ShipmentStatusEnum'
        dispatch_confirmation_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        delivery_confirmation_date:
          type: string
          format: date
          nullable: true
        is_new:
          type: boolean
          readOnly: true
        order_number:
          type: string
          readOnly: true
        number_of_quotes_ordered:
          type: integer
          readOnly: true
        total_price:
          type: number
          readOnly: true
        total_price_currency:
          type: string
          readOnly: true
        delivery_date:
          type: string
          format: date
        shipping_price:
          type: number
          readOnly: true
        shipping_cost_no_vat:
          type: number
          readOnly: true
        sum_to_pay:
          type: number
          readOnly: true
        latest_delivery_date:
          type: string
          format: date
          nullable: true
          readOnly: true
        discount_amount:
          type: number
          readOnly: true
        sum_to_pay_no_discount:
          type: number
          readOnly: true
        quotes_prices:
          type: array
          items:
            $ref: '#/components/schemas/PricesRetrieve'
          readOnly: true
        vat_sum:
          type: number
          readOnly: true
        sum_payout:
          type: number
          readOnly: true
        order_date:
          type: string
          format: date
          nullable: true
        payment_delay:
          type: integer
          nullable: true
          readOnly: true
        has_pending_purchase_request:
          type: boolean
          readOnly: true
        is_recurring:
          type: boolean
          readOnly: true
        related_contract_uuid:
          type: string
          format: uuid
          readOnly: true
        purchase_quote_uuid:
          type: string
          format: uuid
          readOnly: true
        state_updated:
          type: string
          format: date-time
          readOnly: true
        tracking_code:
          type: string
          nullable: true
        selected_currency:
          type: string
          readOnly: true
        virtual_bank_account:
          allOf:
          - $ref: '#/components/schemas/VirtualBankTransfer'
          nullable: true
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/QuoteOrderDetail'
          readOnly: true
        delivery_address:
          allOf:
          - $ref: '#/components/schemas/DeliveryAddressResponse'
          readOnly: true
        terms:
          type: string
          nullable: true
        expected_delivery_date:
          type: string
          format: date
          nullable: true
        shipping_provider:
          type: string
          nullable: true
          maxLength: 255
        delivery_contact:
          type: string
          readOnly: true
        delivery_contact_number:
          type: string
          readOnly: true
        contract_uuid:
          type: string
          format: uuid
          readOnly: true
        bank_transfer_details:
          allOf:
          - $ref: '#/components/schemas/BankTransfer'
          readOnly: true
      required:
      - bank_transfer_details
      - contract_uuid
      - created
      - delivery_address
      - delivery_contact
      - delivery_contact_number
      - delivery_date
      - discount_amount
      - dispatch_confirmation_date
      - has_pending_purchase_request
      - is_new
      - is_recurring
      - latest_delivery_date
      - number_of_quotes_ordered
      - order_number
      - payment_delay
      - payment_scenario
      - purchase_quote_uuid
      - quotes
      - quotes_prices
      - related_contract_uuid
      - selected_currency
      - shipping_cost_no_vat
      - shipping_price
      - state_updated
      - sum_payout
      - sum_to_pay
      - sum_to_pay_no_discount
      - total_price
      - total_price_currency
      - uuid
      - vat_sum
      - virtual_bank_account
    QuoteDescriptionBlock:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        description:
          type: string
      required:
      - description
      - uuid
    FrequencyEnum:
      enum:
      - weekly
      - monthly
      - quarterly
      - annually
      type: string
      description: '* `weekly` - Weekly

        * `monthly` - Monthly

        * `quarterly` - Quarterly

        * `annually` - Annually'
    OrderConfirmDispatched:
      type: object
      properties:
        tracking_code:
          type: string
          nullable: true
        dispatch_confirmation_date:
          type: string
          format: date
        expected_delivery_date:
          type: string
          format: date
        shipping_provider:
          type: string
      required:
      - dispatch_confirmation_date
      - expected_delivery_date
      - shipping_provider
    IngredientsForQuote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
      - uuid
    CompanyAddress:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        contact_full_name:
          type: string
          nullable: true
          maxLength: 255
        contact_phone:
          type: string
          nullable: true
          maxLength: 50
        building:
          type: string
          nullable: true
          maxLength: 100
        street_1:
          type: string
          nullable: true
          maxLength: 255
        street_2:
          type: string
          nullable: true
          maxLength: 255
        town:
          type: string
          nullable: true
          maxLength: 100
        region:
          type: string
          nullable: true
          maxLength: 100
        postcode:
          type: string
          nullable: true
          maxLength: 100
        country:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Country'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        place_id:
          type: string
          nullable: true
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,15})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,15})?$
          nullable: true
        vat_number:
          type: string
          nullable: true
          maxLength: 50
        vat_country_code:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Country'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        vat_exempt:
          type: boolean
        phone_country_code:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PhoneCountryCodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        delivery_instructions:
          type: string
          nullable: true
        collection_instructions:
          type: string
          nullable: true
        country_type:
          $ref: '#/components/schemas/CountryTypeEnum'
        eori_number:
          type: string
          maxLength: 20
        ein_number:
          type: string
          maxLength: 20
        notes:
          type: string
        delivery_location_type:
          type: string
          description: Type of delivery location (warehouse, factory, distribution_center, retail_location, other).
          maxLength: 50
        delivery_location_type_other:
          type: string
          description: Free-text description when delivery_location_type == 'other'.
          maxLength: 255
        warehouse_receiving_hours:
          type: string
          description: Free-text receiving hours (e.g. 'Mon-Fri 9am-5pm').
          maxLength: 255
      required:
      - created
      - id
      - modified
      - name
      - uuid
