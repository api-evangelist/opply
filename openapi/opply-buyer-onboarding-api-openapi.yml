    MoRSupplierSubmission:
      type: object
      description: 'MoR-side read of a buyer''s `buyer_onboarding.Supplier` submission.

        Adds buyer context (company + contact) and review-pipeline pointers

        so an operator can decide whether to match the submission to an

        existing supplier company or promote it into the OnboardingSupplier

        pipeline.'
      properties:
        id:
          type: integer
          readOnly: true
        supplier_name:
          type: string
          readOnly: true
          description: Supplier name
        vat_number:
          type: string
          readOnly: true
          description: Supplier VAT / tax registration number
        registration_number:
          type: string
          readOnly: true
          description: Business/company registration number (e.g. Companies House number; Xero's Contact.CompanyNumber) — distinct from the VAT number.
        products_description:
          type: string
          readOnly: true
          description: Description of products purchased from this supplier
        average_monthly_spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Average monthly spend with this supplier
        invoice_currency:
          type: string
          readOnly: true
          description: Invoice/Payment currency (e.g., USD, GBP, EUR)
        payment_terms:
          type: string
          readOnly: true
          description: Supplier payment terms
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
          description: 'Priority to onboard this supplier


            * `high` - High

            * `medium` - Medium

            * `low` - Low'
        supplier_country:
          type: string
          readOnly: true
          description: Supplier country
        supplier_state:
          type: string
