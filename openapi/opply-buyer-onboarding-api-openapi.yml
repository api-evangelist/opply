      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MoRSupplierMatchCandidate'
    BuyerOnboardingDetail:
      type: object
      description: 'Detailed serializer for buyer onboarding.

        Includes all related information.


        For self-onboarded buyers (`buyer_onboarding.company` is set), the

        name / email fields are derived from the canonical `Company` /

        `User`, and `has_account_details` / `has_delivery_details` consider

        Company columns alongside the legacy AccountDetail/DeliveryDetails

        tables.'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for sharing the onboarding form
        name:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        country:
          $ref: '#/components/schemas/BuyerOnboardingCountry'
        company_uuid:
          type: string
          readOnly: true
        company_name:
          type: string
          readOnly: true
        notes:
          type: string
          description: Internal notes
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the buyer submitted the form
        is_submitted:
          type: string
          readOnly: true
        total_steps:
          type: string
          readOnly: true
        completed_steps:
          type: string
          readOnly: true
        has_account_details:
          type: string
          readOnly: true
        has_delivery_details:
          type: string
          readOnly: true
        suppliers_count:
          type: string
          readOnly: true
        suppliers_pending_review_count:
          type: string
          readOnly: true
        suppliers_completed:
          type: string
          readOnly: true
        suppliers_completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the supplier section was marked as complete
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_name
      - company_uuid
      - completed_steps
      - country
      - created_at
      - email
      - has_account_details
      - has_delivery_details
      - is_submitted
      - modified_at
      - name
      - submitted_at
      - suppliers_completed
      - suppliers_completed_at
      - suppliers_count
      - suppliers_pending_review_count
      - total_steps
      - uuid
