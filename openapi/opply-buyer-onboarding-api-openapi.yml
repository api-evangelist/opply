    MoRSupplierMatchCandidate:
      type: object
      description: Shape of a single match candidate (existing supplier Company).
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        registration_name:
          type: string
          readOnly: true
          nullable: true
        registration_number:
          type: string
          readOnly: true
          nullable: true
        website:
          type: string
          readOnly: true
          nullable: true
      required:
      - name
      - registration_name
      - registration_number
      - uuid
      - website
    AccountDetail:
      type: object
      description: "Serializer for account details with country-specific validation.\nSupports DUNS field and AccountEmail management.\n\nUK buyers require: company_name, vat_number, company_registration_number,\n                  registered_address, contact_name, contact_phone_number,\n                  contact_email_address\n\nUS buyers require: company_name, vat_number (as EIN), registered_address,\n                  contact_name, contact_phone_number, contact_email_address"
      properties:
        id:
          type: integer
          readOnly: true
        company_name:
          type: string
          description: Company name
          maxLength: 255
        vat_number:
          type: string
          description: VAT number
          maxLength: 100
        duns:
          type: string
          nullable: true
        company_registration_number:
          type: string
          description: Company Registration Number (UK only)
          maxLength: 100
        registered_address:
          type: string
          description: Registered company address
        contact_name:
          type: string
          maxLength: 255
        contact_phone_number:
          type: string
          maxLength: 50
        contact_email_address:
          type: string
          format: email
          description: 'Contact email address (DEPRECATED: Use account_emails relationship instead)'
          maxLength: 255
        tax_exemption_certificate:
          type: boolean
          description: Tax exemption certificate (US only)
        account_emails:
          type: array
          items:
            $ref: '#/components/schemas/AccountEmail'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_emails
      - company_name
      - contact_name
      - contact_phone_number
      - created_at
      - id
      - modified_at
      - registered_address
      - vat_number
    PaginatedSupplierList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
    CountryTypeEnum:
      enum:
      - EU
      - GB
      - Other
      type: string
      description: '* `EU` - Eu

        * `GB` - Gb

        * `Other` - Other'
    DeliveryEmail:
      type: object
      description: Serializer for DeliveryEmail model.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for delivery email lookup
        label:
          type: string
          description: Label for this delivery contact (e.g. 'Goods In')
          maxLength: 255
        email_address:
          type: string
          format: email
          description: Delivery contact email
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email_address
      - label
      - modified_at
      - uuid
    InviteBuyerResponse:
      type: object
      description: 'Response shape for the new `invite` endpoint.


        No `link` field — the buyer is invited via the `commit-onboarding`

        email and enters the app authenticated.'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        country:
          allOf:
          - $ref: '#/components/schemas/BuyerOnboardingCountry'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - country
      - created_at
      - email
      - name
      - uuid
    BuyerOnboardingLinkResponse:
      type: object
      description: 'Response serializer for the legacy `generate-link` endpoint.

        Includes the UUID-based shareable onboarding URL.'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        country:
          allOf:
          - $ref: '#/components/schemas/BuyerOnboardingCountry'
          readOnly: true
        link:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - country
      - created_at
      - email
      - link
      - name
      - uuid
    DeliveryLocationTypeEnum:
      enum:
      - warehouse
      - factory
      - distribution_center
      - retail_location
      - other
      type: string
      description: '* `warehouse` - Warehouse

        * `factory` - Factory

        * `distribution_center` - Distribution Center

        * `retail_location` - Retail Location

        * `other` - Other'
    AddressTypeEnum:
      enum:
      - billing_address
      - delivery_address
      - dispatch_address
      - company_address
      type: string
      description: '* `billing_address` - Billing address

        * `delivery_address` - Delivery address

        * `dispatch_address` - Dispatch address

        * `company_address` - Company address'
    BuyerOnboardingCountry:
      enum:
      - us
      - uk
      type: string
      description: '* `us` - United States

        * `uk` - United Kingdom'
    MoRSupplierMatch:
      type: object
      description: 'Payload for `POST .../supplier-submissions/{id}/match/`.


        The candidate Company is constrained to suppliers scoped to the calling

        MoR (`merchant_of_record=context[''merchant_of_record'']`) so an MoR can

        never match a buyer to another MoR''s supplier.'
      properties:
        company_uuid:
          type: string
          format: uuid
      required:
      - company_uuid
    PaginatedMoRSupplierMatchCandidateList:
      type: object
      required:
      - count
