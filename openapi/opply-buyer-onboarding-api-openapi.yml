    InviteBuyer:
      type: object
      description: "Serializer for inviting a buyer through the new MoR onboarding flow\n(feature flag `isBuyerInvitationFlowEnabled` on).\n\nRequired fields:\n- name: Buyer's trading name (used as Company.name when company_name\n  is not separately provided).\n- email: Buyer contact email (must not already belong to a registered user).\n- country: US or UK.\n\nOptional:\n- company_name: Explicit Company.name override. When omitted the serializer\n  falls back to `name`.\n- first_name / last_name: Contact-person name on the new dialog. When\n  omitted, the trading name is used as first_name so the welcome email\n  greeting stays non-empty.\n- registration_name / registration_number: Legal registration name and\n  registration/incorporation number, stored on the new Company row.\n  `registration_country_code` is not a separate input — it is derived\n  from `country` (us -> US, uk -> GB).\n- is_connected_to_allianz / is_connected_to_two: Integration flags set on\n  the new Company row (default False).\n- allianz_company_id: Allianz company id for the credit-limit\n  integration, stored on the new Company row.\n- two_us_company_id: Two US company id (e.g. DUNS) for US buyers, stored\n  on the new Company row.\n\nCreates, atomically:\n  - User (no password — set via the password-create email link)\n  - Company (brand, onboarding_state=in_progress, scoped to the MoR)\n  - Employee linking the new User to the new Company\n  - BuyerOnboarding row carrying the contact/country fields (form data\n    for Phase 2 will hang off this)\n\nOn commit, dispatches `EmailSender.send_buyer_onboarding_invite` so the\nbuyer receives the `commit-onboarding` link to set their password and log in.\nThe MoR no longer receives a shareable link — the buyer enters the app\nvia the standard authenticated flow."
      properties:
        name:
          type: string
          description: Buyer contact name
          maxLength: 255
        email:
          type: string
          format: email
          description: Buyer contact email
          maxLength: 255
        country:
          $ref: '#/components/schemas/BuyerOnboardingCountry'
        company_name:
          type: string
          writeOnly: true
          maxLength: 255
        first_name:
          type: string
          writeOnly: true
          maxLength: 150
        last_name:
          type: string
          writeOnly: true
          maxLength: 150
        registration_name:
          type: string
          writeOnly: true
          maxLength: 255
        registration_number:
          type: string
          writeOnly: true
          maxLength: 255
        is_connected_to_allianz:
          type: boolean
          writeOnly: true
          default: false
        allianz_company_id:
          type: string
          writeOnly: true
          maxLength: 255
        is_connected_to_two:
          type: boolean
          writeOnly: true
          default: false
        two_us_company_id:
          type: string
          writeOnly: true
          maxLength: 255
      required:
      - country
      - email
      - name
    Supplier:
      type: object
      description: 'Serializer for supplier information.


