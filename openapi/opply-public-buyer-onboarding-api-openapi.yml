      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerOnboardingDeliveryAddress'
          description: ''
        '400':
          description: Validation error
        '404':
          description: Address not found
  /api/v1/buyer-onboarding/public/buyers/{uuid}/delivery-addresses/create/:
