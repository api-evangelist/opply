    DeliveryEmailList:
      type: object
      description: 'Serializer for handling create/update/delete operations on a list of delivery emails.

        Accepts a list of delivery email objects and handles validation, creation, updates, and deletions.'
      properties:
        delivery_emails:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: List of delivery email objects with 'uuid' (optional), 'label', and 'email_address'
      required:
      - delivery_emails
    AccountDetail:
      type: object
      description: "Serializer for account details with country-specific validation.\nSupports DUNS field and AccountEmail management.\n\nUK buyers require: company_name, vat_number, company_registration_number,\n                  registered_address, contact_name, contact_phone_number,\n                  contact_email_address\n\nUS buyers require: company_name, vat_number (as EIN), registered_address,\n                  contact_name, contact_phone_number, contact_email_address"
      properties:
        id:
          type: integer
          readOnly: true
        company_name:
          type: string
          description: Company name
          maxLength: 255
        vat_number:
          type: string
          description: VAT number
          maxLength: 100
        duns:
          type: string
          nullable: true
        company_registration_number:
          type: string
          description: Company Registration Number (UK only)
          maxLength: 100
        registered_address:
          type: string
          description: Registered company address
        contact_name:
          type: string
          maxLength: 255
        contact_phone_number:
          type: string
          maxLength: 50
        contact_email_address:
          type: string
          format: email
          description: 'Contact email address (DEPRECATED: Use account_emails relationship instead)'
          maxLength: 255
        tax_exemption_certificate:
          type: boolean
          description: Tax exemption certificate (US only)
        account_emails:
          type: array
          items:
            $ref: '#/components/schemas/AccountEmail'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_emails
      - company_name
      - contact_name
      - contact_phone_number
      - created_at
      - id
      - modified_at
      - registered_address
      - vat_number
    PaginatedSupplierList:
      type: object
