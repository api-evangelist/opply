    PatchedSupplier:
      type: object
      description: 'Serializer for supplier information.


        Only includes fields that are actively used in the public buyer onboarding form.

        Other model fields are kept for backward compatibility but not exposed in the API.'
      properties:
        id:
          type: integer
          readOnly: true
        supplier_name:
          type: string
          description: Supplier name
          maxLength: 255
        average_monthly_spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Average monthly spend with this supplier
        invoice_currency:
          type: string
          description: Invoice/Payment currency (e.g., USD, GBP, EUR)
          maxLength: 3
        payment_terms:
          type: string
          description: Supplier payment terms
        priority:
          description: 'Priority to onboard this supplier


            * `high` - High

            * `medium` - Medium

            * `low` - Low'
          oneOf:
          - $ref: '#/components/schemas/PriorityEnum'
          - $ref: '#/components/schemas/BlankEnum'
        supplier_country:
          type: string
          description: Supplier country
          maxLength: 100
        arranges_delivery:
          type: boolean
          description: Does the supplier arrange delivery?
        lead_time:
          type: string
          description: Agreed lead time
          maxLength: 255
        is_organic:
          type: boolean
          description: Is this an organic supplier?
        relationship_notes:
          type: string
          description: Any noteworthy information about your trading relationship
        supplier_spreadsheet:
          type: string
          format: uri
          nullable: true
          description: Supplier spreadsheet
        supplier_spreadsheet_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
    PaginatedBuyerOnboardingDeliveryAddressList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/BuyerOnboardingDeliveryAddress'
    AccountEmail:
      type: object
      description: Serializer for AccountEmail model.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for account email lookup
        label:
          type: string
          description: Label for this contact (e.g. 'Accounts Payable')
          maxLength: 255
        email_address:
          type: string
          format: email
          description: Contact email address
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email_address
      - label
      - modified_at
      - uuid
    PatchedAccountDetail:
      type: object
      description: "Serializer for account details with country-specific validation.\nSupports DUNS field and AccountEmail management.\n\nUK buyers require: company_name, vat_number, company_registration_number,\n                  registered_address, contact_name, contact_phone_number,\n                  contact_email_address\n\nUS buyers require: company_name, vat_number (as EIN), registered_address,\n                  contact_name, contact_phone_number, contact_email_address"
      properties:
        id:
          type: integer
          readOnly: true
        company_name:
          type: string
          description: Company name
          maxLength: 255
        vat_number:
          type: string
          description: VAT number
          maxLength: 100
        duns:
          type: string
          nullable: true
        company_registration_number:
          type: string
          description: Company Registration Number (UK only)
          maxLength: 100
        registered_address:
          type: string
          description: Registered company address
        contact_name:
          type: string
          maxLength: 255
        contact_phone_number:
          type: string
          maxLength: 50
        contact_email_address:
          type: string
          format: email
          description: 'Contact email address (DEPRECATED: Use account_emails relationship instead)'
          maxLength: 255
        tax_exemption_certificate:
          type: boolean
          description: Tax exemption certificate (US only)
        account_emails:
          type: array
          items:
            $ref: '#/components/schemas/AccountEmail'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
