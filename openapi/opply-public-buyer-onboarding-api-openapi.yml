          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When this step was completed
        completed_by:
          type: integer
          readOnly: true
          nullable: true
          description: Who completed this step
        completed_by_email:
          type: string
          format: email
          readOnly: true
        custom_step_order:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
