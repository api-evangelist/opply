          type: string
          description: Any noteworthy information about your trading relationship
        supplier_spreadsheet:
          type: string
          format: uri
          nullable: true
          description: Supplier spreadsheet
        supplier_spreadsheet_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
