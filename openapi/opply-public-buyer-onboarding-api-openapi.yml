        template_phase:
          type: string
          readOnly: true
        template_phase_display:
          type: string
          readOnly: true
        process_description:
          type: string
          readOnly: true
        template_step_order:
          type: integer
          readOnly: true
        notes:
          type: string
          description: Buyer-specific notes for this step
        is_completed:
          type: boolean
          description: Whether this step is completed
