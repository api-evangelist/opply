openapi: 3.0.3
info:
  title: Opply Activity Feed Rapyd API
  version: 0.0.0
tags:
- name: Rapyd
paths:
  /api/v1/rapyd/check_kyb/:
    get:
      operationId: api_v1_rapyd_check_kyb_retrieve
      tags:
      - Rapyd
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYBVerificationStatusResponse'
          description: ''
  /api/v1/rapyd/check_pay_in_advance_availability/:
    post:
      operationId: api_v1_rapyd_check_pay_in_advance_availability_create
      tags:
      - Rapyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAvailability'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentAvailability'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentAvailability'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Boolean value
  /api/v1/rapyd/get_checkout_id/:
    post:
      operationId: api_v1_rapyd_get_checkout_id_create
      tags:
      - Rapyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RapydCheckout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RapydCheckout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RapydCheckout'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RapydCheckoutData'
          description: ''
  /api/v1/rapyd/get_checkout_id_supplier_terms_pay_by_card/:
    post:
      operationId: api_v1_rapyd_get_checkout_id_supplier_terms_pay_by_card_create
      tags:
      - Rapyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RapydCheckout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RapydCheckout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RapydCheckout'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RapydSupplierTermsCard'
          description: ''
  /api/v1/rapyd/kyb/step1/:
    post:
      operationId: api_v1_rapyd_kyb_step1_create
      summary: step1 KYB questionnaire (onboarding)
      tags:
      - Rapyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KYBStep1'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KYBStep1'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KYBStep1'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYBStep1Response'
          description: ''
  /api/v1/rapyd/payout/callback/:
    post:
      operationId: api_v1_rapyd_payout_callback_create
      tags:
      - Rapyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutCallback'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayoutCallback'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayoutCallback'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
        '404':
          description: no company with such merchant_reference_id
        '403':
          description: payout method was already chosen
        '429':
          description: too many requests
  /api/v1/rapyd/payout/get_redirect_id/:
    post:
      operationId: api_v1_rapyd_payout_get_redirect_id_create
      tags:
      - Rapyd
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/rapyd/payout/set_company_type/:
    post:
      operationId: api_v1_rapyd_payout_set_company_type_create
      tags:
      - Rapyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutCompanyType'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayoutCompanyType'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayoutCompanyType'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutCompanyType'
          description: ''
  /api/v1/rapyd/payout/status/:
    get:
      operationId: api_v1_rapyd_payout_status_retrieve
      tags:
      - Rapyd
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYBVerificationStatusResponse'
          description: ''
  /api/v1/rapyd/save_customer_card/:
    post:
      operationId: api_v1_rapyd_save_customer_card_create
      description: should be called after Payment by Card on FE and before update_order_status_after_payment
      summary: Should be called after Payment by Card on FE and before update_order_status_after_payment
      tags:
      - Rapyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RapydSavePayment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RapydSavePayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RapydSavePayment'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/rapyd/update_order_status_after_payment/:
    post:
      operationId: api_v1_rapyd_update_order_status_after_payment_create
      tags:
      - Rapyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RapydPostCheckout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RapydPostCheckout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RapydPostCheckout'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/rapyd/webhooks/secret_path/:
    post:
      operationId: api_v1_rapyd_webhooks_secret_path_create
      description: 'webhook body has such structure:

        {

        id: ''wh_81a54cf977b0b6b3ee57d870e2d6ec4a'',

        type: ''CUSTOMER_PAYMENT_METHOD_CREATED'',

        data: {some data structure depending on webhook type},

        trigger_operation_id: ''0fd3bdc9-de75-4768-bc12-b807582b069c'',

        status: ''NEW'',

        created_at: 1575812351

        }'
      tags:
      - Rapyd
      security:
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    PayoutCallback:
      type: object
      properties:
        beneficiary_id:
          type: string
        payout_method_type:
          type: string
        merchant_reference_id:
          type: string
      required:
      - beneficiary_id
      - merchant_reference_id
      - payout_method_type
    PayoutCompanyType:
      type: object
      properties:
        company_type:
          $ref: '#/components/schemas/PayoutCompanyTypeCompanyTypeEnum'
      required:
      - company_type
    PayoutCompanyTypeCompanyTypeEnum:
      enum:
      - Sole Proprietor
      - Private Limited Company
      type: string
      description: '* `Sole Proprietor` - Sole Proprietor

        * `Private Limited Company` - Private Limited Company'
    BankAccount:
      type: object
      properties:
        beneficiary_name:
          type: string
        address:
          type: string
        sort_code:
          type: string
          nullable: true
        account_no:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
        aba_routing_number:
          type: string
          nullable: true
        account_type:
          type: string
          nullable: true
      required:
      - address
      - beneficiary_name
    OrderPrices:
      type: object
      properties:
        commission_payout_with_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        shipping_cost_with_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        sum_to_pay:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        sum_payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/PricesRetrieve'
        currency:
          $ref: '#/components/schemas/AllCurrencies'
        commission_payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        payment_commission:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        total_price_commission:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        total_price_commission_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        total_price_fx_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        commission_payout_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        buyer_total_price_sum_to_pay_without_fx:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        total_price_with_commission_with_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        sum_to_pay_no_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        unit_price_with_commission_with_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        unit_price_no_vat_with_shipping:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        total_price_no_vat_with_shipping:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        unit_price_no_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        total_price_no_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        shipping_cost_no_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        vat_sum:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        unit_price_with_vat_with_shipping:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
      required:
      - buyer_total_price_sum_to_pay_without_fx
      - commission_payout
      - commission_payout_vat
      - commission_payout_with_vat
      - currency
      - payment_commission
      - quotes
      - shipping_cost_with_vat
      - sum_payout
      - sum_to_pay
      - total_price
      - total_price_commission
      - total_price_commission_vat
      - total_price_fx_fee
      - total_price_with_commission_with_vat
    RapydSavePayment:
      type: object
      properties:
        fingerprint_token:
          type: string
        customer_token:
          type: string
        payment_id:
          type: string
        order_id:
          type: string
      required:
      - order_id
      - payment_id
    KYBVerificationStatusResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/KYBVerificationStatusResponseStatusEnum'
        current_step:
          type: integer
          maximum: 4
          minimum: 1
        redirect_url:
          type: string
          format: uri
          nullable: true
      required:
      - current_step
      - status
    PaymentScenarioEnum:
      enum:
      - in_advance
      - on_dispatch
      type: string
      description: '* `in_advance` - In Advance

        * `on_dispatch` - On Dispatch'
    PricesRetrieve:
      type: object
      properties:
        currency:
          type: string
        name:
          type: string
        quote_uuid:
