    KYBVerificationStatusResponseStatusEnum:
      enum:
      - Not started
      - Started
      - In Review
      - Completed
      type: string
      description: '* `Not started` - Not started

        * `Started` - Started

        * `In Review` - In Review

        * `Completed` - Completed'
    PaymentAvailability:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
      required:
      - order_id
    RapydPostCheckout:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        selected_currency:
          $ref: '#/components/schemas/SupportedCurrencies'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        payment_scenario:
          $ref: '#/components/schemas/PaymentScenarioEnum'
      required:
      - order_id
      - payment_method
      - payment_scenario
    RapydSupplierTermsCard:
      type: object
      properties:
        redirect_url:
          type: string
          format: uri
      required:
      - redirect_url
    PaymentMethod:
      enum:
      - card
      - bank_transfer
      - PAY30
      - PAY30EOFM
      type: string
      description: '* `card` - Card

        * `bank_transfer` - Bank Transfer

        * `PAY30` - Kriya 30

        * `PAY30EOFM` - Kriya Next Month'
    SupportedCurrencies:
      enum:
      - EUR
      - GBP
      - USD
      - CAD
      type: string
      description: '* `EUR` - EUR

        * `GBP` - GBP

        * `USD` - USD

        * `CAD` - CAD'
    BankTransfer:
      type: object
      properties:
        merchant_reference_id:
          type: string
        reference_number:
          type: string
        bank_account:
          allOf:
          - $ref: '#/components/schemas/BankAccount'
          nullable: true
      required:
      - merchant_reference_id
      - reference_number
    RapydCheckout:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        selected_currency:
          $ref: '#/components/schemas/SupportedCurrencies'
      required:
      - order_id
    KYBStep1Response:
      type: object
      properties:
        redirect_url:
          type: string
          format: uri
      required:
      - redirect_url
    VirtualBankTransfer:
      type: object
      properties:
        bank_account:
          type: string
          readOnly: true
        merchant_reference_id:
          type: string
          readOnly: true
        reference_number:
          type: string
          readOnly: true
      required:
      - bank_account
      - merchant_reference_id
      - reference_number
    RapydCheckoutData:
      type: object
      properties:
        checkout_id:
          type: string
        redirect_url:
          type: string
          format: uri
        complete_checkout_url:
          type: string
          format: uri
        prices:
          $ref: '#/components/schemas/OrderPrices'
        virtual_bank_account:
          $ref: '#/components/schemas/VirtualBankTransfer'
        bank_transfer_details:
          allOf:
          - $ref: '#/components/schemas/BankTransfer'
          nullable: true
      required:
      - checkout_id
      - complete_checkout_url
      - prices
      - redirect_url
      - virtual_bank_account
    KYBStep1:
      type: object
      properties:
        phone_number:
          type: string
        phone_country_code:
          type: string
      required:
      - phone_country_code
      - phone_number
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
