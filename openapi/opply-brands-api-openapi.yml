        supplier_lead_time_days:
          type: integer
          maximum: 365
          minimum: 0
          nullable: true
          description: Default number of calendar days this supplier needs between order and delivery. Factored into the earliest selectable delivery date on orders.
        marketplace_tc_status:
          allOf:
          - $ref: '#/components/schemas/MarketplaceTcStatusEnum'
          readOnly: true
        marketplace_tc_url:
          type: string
          nullable: true
          description: Returns URL of current T&C version.
          readOnly: true
        onboarding_state:
          allOf:
          - $ref: '#/components/schemas/CompanyOnboardingStateEnum'
          readOnly: true
          description: 'Buyer onboarding lifecycle. Default ''active'' so existing rows and non-buyer Companies are unaffected. New buyers signed up via the brand onboarding flow are created with ''in_progress'' and flip to ''active'' once they finish onboarding.


            * `in_progress` - In progress

            * `active` - Active'
        is_on_hold:
          type: boolean
          readOnly: true
          description: Whether the buyer's account is on hold, which blocks placing new orders.
        on_hold_reason:
          type: string
          readOnly: true
          description: Buyer-facing reason for the current hold; empty string when not on hold.
      required:
      - buyer_accounts_email_address
      - buyer_delivery_email_address
      - company_addresses
      - country
      - currency
      - id
      - is_on_hold
      - kyb_status
      - marketplace_tc_status
      - marketplace_tc_url
      - merchant_of_record_name
      - mongo_id
      - name
      - on_hold_reason
      - onboarding_state
      - referral_code
      - state
      - uuid
      - zendesk_chat_token
      - zendesk_chat_widget_key
    UnitOfMeasurementEnum:
      enum:
      - fl oz
      - g
      - mg
      - gals
      - kg
      - L
      - tons
      - oz
      - lbs
      - pcs
      - pt
      - ml
      - boxes
      - pallets
      - tsp
      - tbsp
      - units
      - cases
      - trays
      type: string
      description: '* `fl oz` - Fluid Ounces

        * `g` - Grams

        * `mg` - milligrams

        * `gals` - Gallons

        * `kg` - Kilograms

        * `L` - Liters

        * `tons` - Metric Tons

        * `oz` - Ounces

        * `lbs` - Pounds

        * `pcs` - Pieces

        * `pt` - Pints

        * `ml` - Milliliter

        * `boxes` - Boxes

        * `pallets` - Pallets

        * `tsp` - Teaspoons

        * `tbsp` - Tablespoons

        * `units` - Units

        * `cases` - Cases

        * `trays` - Trays'
    PaginatedCompanyAddressList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CompanyAddress'
    PaginatedExistingSuppliersListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExistingSuppliersList'
    SectionSupplier:
