              $ref: '#/components/schemas/CompanyAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyAddress'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyAddress'
          description: ''
