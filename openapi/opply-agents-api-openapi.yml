openapi: 3.2.0
info:
  title: Opply Agents API
  version: 0.0.0
tags:
- name: Agents
paths:
  /api/v1/agents/admin/installations/:
    get:
      operationId: api_v1_agents_admin_installations_list
      description: '``GET /api/v1/agents/admin/installations/`` — installable agents + current install status.'
      summary: List installable agents for the current tenant (admin only)
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentInstallationAdminRow'
          description: ''
  /api/v1/agents/admin/installations/{agent_uuid}/:
    patch:
      operationId: api_v1_agents_admin_installations_partial_update
      description: '``PATCH /api/v1/agents/admin/installations//`` — set installation status.


        If no installation exists and ``status=''active''``, the installation (and its

        shadow user) is created via ``create_installation``. Otherwise the existing

        installation''s status is updated. Returns the serialized row.'
      summary: Set the installation status for an agent on the current tenant (admin only)
      parameters:
      - in: path
        name: agent_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patched_SetStatusInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Patched_SetStatusInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Patched_SetStatusInput'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstallationAdminRow'
          description: ''
        '404':
          description: Agent not found or not installable.
  /api/v1/agents/agent-task-runs/{run_uuid}/claim/:
    post:
      operationId: api_v1_agents_agent_task_runs_claim_create
      description: 'Atomic ``dispatching → running`` transition. The agent-side dedup point.


        Called by the task-runner harness immediately on workflow entry. The

        first invocation wins (status flips, 200 returned); any duplicate

        dispatch for the same ``run_uuid`` loses the status guard and gets

        409. Resolves the historical "delivery state unknown" ambiguity

        when the dispatcher''s POST to AgentCore times out and Celery

        autoretries — both invocations may execute, but only one claims.'
      parameters:
      - in: path
        name: run_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Claim succeeded — run advanced to running.
        '403':
          description: Run is not owned by the caller installation.
        '404':
          description: Run not found.
        '409':
          description: Lost claim race — run is not in dispatching.
      summary: Api v1 agents agent task runs claim create
      x-summary-source: derived
  /api/v1/agents/agent-task-runs/{run_uuid}/complete/:
    post:
      operationId: api_v1_agents_agent_task_runs_complete_create
      description: Agent-only callback to mark an ``AgentTaskRun`` terminal.
      parameters:
      - in: path
        name: run_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Run marked terminal (idempotent on double-complete).
        '400':
          description: Invalid request body.
        '403':
          description: Run is not owned by the caller installation.
        '404':
          description: Run not found.
        '409':
          description: Run is not in running state — claim must precede complete.
      summary: Api v1 agents agent task runs complete create
      x-summary-source: derived
  /api/v1/agents/agent-task-runs/{run_uuid}/heartbeat/:
    post:
      operationId: api_v1_agents_agent_task_runs_heartbeat_create
      description: 'Refresh ``last_heartbeat_at`` on a running run.


        Agent calls this every ~30s while executing. Single UPDATE — no

        SELECT, no transaction — at this cadence the cost matters. A 409

        response is the agent''s signal to abort its loop: the run has been

        re-dispatched as a fresh row, watchdog-timed-out, cancelled, or

        moved out of running for some other reason.'
      parameters:
      - in: path
        name: run_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Heartbeat refreshed.
        '409':
          description: Run is no longer in running state — agent should abort its loop.
      summary: Api v1 agents agent task runs heartbeat create
      x-summary-source: derived
  /api/v1/agents/buyer-onboarding/invocations/:
    post:
      operationId: api_v1_agents_buyer_onboarding_invocations_create
      description: 'Streaming proxy for ``POST /api/v1/agents/buyer-onboarding/invocations/``.


        Body:

        - ``prompt``: required str.

        - ``session_id``: optional; defaults to a fresh ``opply-``.

        - ``batch_uuid``: optional. When present, the proxy validates that

        the batch belongs to ``request.user_company``, loads its invoices,

        mints short-TTL presigned URLs, and forwards them as

        ``invoices: [{uuid, filename, mime, signed_url, page_count}]`` in

        the upstream payload. Cross-tenant attempts 404.


        Response: ``text/event-stream`` of ``AgentStreamEvent`` frames — see

        ``packages/agent-protocol/src/index.ts``. The agent emits the new

        ``opplyExtractionStarted | Progress | Complete | Failed`` variants.'
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
      summary: Api v1 agents buyer onboarding invocations create
      x-summary-source: derived
  /api/v1/agents/debug/system-tasks/:
    get:
      operationId: api_v1_agents_debug_system_tasks_list
      description: '``GET /api/v1/agents/debug/system-tasks/`` — agent-assigned tasks for a company.


        Optional ``?company_uuid=`` (defaults to the caller''s own company; targeting

        another company requires staff). Returns the most recent agent-assigned Tasks

        serialized with ``TaskSerializer``.'
      summary: List agent (system) tasks for a company (staff cross-tenant; self otherwise)
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/agents/feedback/:
    post:
      operationId: api_v1_agents_feedback_create
      description: Create / upsert one feedback row per (user, agent_name, invocation_id).
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentResponseFeedbackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentResponseFeedbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentResponseFeedbackRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseFeedback'
          description: New feedback row.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseFeedback'
          description: Existing row updated (upsert).
        '400':
          description: Invalid request body or cross-polarity tag combination.
        '403':
          description: No company context on the request.
      summary: Api v1 agents feedback create
      x-summary-source: derived
  /api/v1/agents/fleet/:
    get:
      operationId: api_v1_agents_fleet_list
      description: '``GET /api/v1/agents/fleet/`` — every enabled agent + install counts (MoR only).'
      summary: 'Fleet overview: all agents + per-agent install counts (MoR only)'
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FleetAgent'
          description: ''
  /api/v1/agents/fleet/{slug}/:
    get:
      operationId: api_v1_agents_fleet_retrieve
      description: '``GET /api/v1/agents/fleet//`` — one agent''s detail + run stats + install list (MoR only).'
      summary: 'Fleet detail: one agent''s run stats + install list (MoR only)'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFleetDetail'
          description: ''
  /api/v1/agents/installations/me/:
    get:
      operationId: api_v1_agents_installations_me_retrieve
      description: Returns the active ``AgentInstallation`` for ``request.user_company`` along with the shadow user's UUID + name. Used by the buyer FE to address the agent when creating a new Task. Returns ``204 No Content`` when the tenant has no active installation.
      summary: Get the active agent installation for the current tenant
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstallationMe'
          description: ''
        '204':
          description: Tenant has no active agent installation.
  /api/v1/agents/mor-router/me/:
    get:
      operationId: api_v1_agents_mor_router_me_retrieve
      description: '``GET /api/v1/agents/mor-router/me/`` — the buyer''s MoR tasks-router ("Opply").


        Lets the buyer FE surface "Opply" as an assignable actor: a buyer assigns a

        task to ``shadow_user.uuid`` and the BE stamps ``Task.mor_router``. Returns

        ``available=false`` when the buyer has no MoR, or the MoR has no active

        router install. The shadow user''s ``name`` is the MoR''s display name

        ("Opply"), matching the read-layer masking.'
      summary: Get the buyer's Merchant-of-Record tasks-router ('Opply')
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MorRouterMe'
          description: ''
  /api/v1/agents/opply-assistant/invocations/:
    post:
      operationId: api_v1_agents_opply_assistant_invocations_create
      description: 'Streaming proxy for ``POST /api/v1/agents/opply-assistant/invocations/``.


        opply-assistant — orchestrator hosting the buyer-assistant worker. The

        request''s ``channel`` field selects the AgentCore version channel

        (``next`` → the candidate endpoint). See ``_AssistantInvocationsBaseView``

        for the shared chat-proxy contract (auth, throttling, response format,

        request body shape).'
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
      summary: Api v1 agents opply assistant invocations create
      x-summary-source: derived
  /api/v1/agents/opply-assistant/sessions/me/:
    get:
      operationId: api_v1_agents_opply_assistant_sessions_me_retrieve
      description: '``GET`` / ``DELETE`` the opply-assistant session pointer for the current user.


        See ``_AssistantSessionMeBaseView`` for the shared contract.'
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
          description: ''
        '204':
          description: No active session yet for this user.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailError'
          description: An active company is required to access agent sessions.
      summary: Api v1 agents opply assistant sessions me retrieve
      x-summary-source: derived
    delete:
      operationId: api_v1_agents_opply_assistant_sessions_me_destroy
      description: '``GET`` / ``DELETE`` the opply-assistant session pointer for the current user.


        See ``_AssistantSessionMeBaseView`` for the shared contract.'
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Session cleared (idempotent — same response when no row existed).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailError'
          description: An active company is required to access agent sessions.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailError'
          description: Session clearing is temporarily unavailable. Please try again.
      summary: Api v1 agents opply assistant sessions me destroy
      x-summary-source: derived
  /api/v1/agents/opply-assistant/sessions/me/events/:
    get:
      operationId: api_v1_agents_opply_assistant_sessions_me_events_retrieve
      description: '``GET`` the opply-assistant conversation transcript for the active session.


        See ``_AssistantSessionEventsBaseView`` for the shared contract.'
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionMessages'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailError'
          description: An active company is required to access agent sessions.
      summary: Api v1 agents opply assistant sessions me events retrieve
      x-summary-source: derived
  /api/v1/agents/unleashed-invoice-assistant/invocations/:
    post:
      operationId: api_v1_agents_unleashed_invoice_assistant_invocations_create
      description: 'Streaming proxy for ``POST /api/v1/agents/unleashed-invoice-assistant/invocations/``.


        Body:

        - ``session_id``: optional; defaults to a fresh ``opply-``.

        - ``prompt``: optional; ignored by the agent but forwarded for parity.


        Response: ``text/event-stream`` of ``AgentStreamEvent`` frames. The agent

        emits the ``opplyExtraction*`` variants itself.'
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
      summary: Api v1 agents unleashed invoice assistant invocations create
      x-summary-source: derived
  /api/v1/agents/xero-invoice-assistant/invocations/:
    post:
      operationId: api_v1_agents_xero_invoice_assistant_invocations_create
      description: 'Streaming proxy for ``POST /api/v1/agents/xero-invoice-assistant/invocations/``.


        Body:

        - ``session_id``: optional; defaults to a fresh ``opply-``.

        - ``prompt``: optional; ignored by the agent but forwarded for parity.


        Response: ``text/event-stream`` of ``AgentStreamEvent`` frames. The agent

        emits the ``opplyExtraction*`` variants itself.'
      tags:
      - Agents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
      summary: Api v1 agents xero invoice assistant invocations create
      x-summary-source: derived
components:
  schemas:
    Task:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        number:
          type:
          - integer
          - 'null'
          readOnly: true
          description: 'Per-company task number (human-facing id, e.g. #12).'
        title:
          type: string
          maxLength: 512
        description:
          type: string
        due_date:
          type:
          - string
          - 'null'
          format: date
        status:
          $ref: '#/components/schemas/TaskStatusEnum'
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        priority:
          $ref: '#/components/schemas/TaskPriorityEnum'
        is_private:
          type: boolean
        assignee:
          allOf:
          - $ref: '#/components/schemas/UserMinimal'
          readOnly: true
        assignee_uuid:
          type:
          - string
          - 'null'
          format: uuid
          writeOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserMinimal'
          readOnly: true
        watchers:
          type: array
          items:
            $ref: '#/components/schemas/UserMinimal'
          readOnly: true
        watcher_uuids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        show_buyer_chat_notice:
          type: boolean
          description: 'True only for a MoR-side viewer of a buyer task routed to "Opply".


            The MoR handler needs to know the task chat is cross-tenant: the buyer

            can read it (MoR authors are masked as "Opply" on the buyer side, but the

            messages themselves are visible). Buyer-side viewers get ``False`` — the

            task is already theirs and the notice would be meaningless to them. Keyed

            off the same ``viewer_is_buyer_side`` helper the assignee/watcher masking

            uses, so the notice and the masking never disagree.'
          readOnly: true
        requester:
          type:
          - object
          - 'null'
          properties:
            uuid:
              type: string
              format: uuid
            name:
              type: string
          readOnly: true
        targets:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        target_items:
          type: array
          items:
            $ref: '#/components/schemas/RelatedItemInput'
          writeOnly: true
        parent_task:
          type:
          - object
          - 'null'
          additionalProperties: {}
          readOnly: true
        parent_task_uuid:
          type:
          - string
          - 'null'
          format: uuid
          writeOnly: true
        subtasks:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        attachments:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
          description: List of task attachments
        unread_chat_count:
          type: integer
          description: 'Caller''s unread in-app chat count — present only when the queryset was

            annotated (list / `/me`); 0 on retrieve / create responses.'
          readOnly: true
        unread_mention_count:
          type: integer
          description: 'How many of the caller''s unread messages @-mention them — drives the

            red attention badge. Annotated on list / `/me`; 0 elsewhere.'
          readOnly: true
        plan_awaiting_revision:
          type: boolean
          description: 'True while the task waits for plan approval AND the newest

            post-version plan-thread message is human-authored — i.e. a human

            requested changes and the chat-dispatch hook guarantees the agent

            answers, so "action required" attention cues can pause. Mirrors the

            detail panel''s ``awaitingRevision`` derivation (an agent reply — even

            without a revision — hands the turn back). Annotated on list / `/me`;

            False elsewhere.'
          readOnly: true
        status_locked:
          type: boolean
          description: 'True while the DB status is ``waiting_approval`` — server-managed

            by the plan gate. Clients key status-control read-only-ness on THIS

            (not on the rendered ``status``, which is masked to ``in_progress``

            for viewers without decision rights and would otherwise re-enable

            controls whose PATCH the gate rejects).'
          readOnly: true
        recurrence_summary:
          type:
          - object
          - 'null'
          properties:
            uuid:
              type: string
              format: uuid
            is_template:
              type: boolean
            is_enabled:
              type: boolean
            frequency:
              type: string
            interval:
              type: integer
            weekdays:
              type: array
              items:
                type: string
            monthly_mode:
              type: string
            weekday_ordinal:
              type:
              - integer
              - 'null'
            cron_expression:
              type:
              - string
              - 'null'
            starts_at:
              type:
              - string
              - 'null'
              format: date-time
            ends_mode:
              type: string
            ends_on:
              type:
              - string
              - 'null'
              format: date
            ends_after_count:
              type:
              - integer
              - 'null'
            overlap_policy:
              type: string
            next_run_at:
              type:
              - string
              - 'null'
              format: date-time
            last_run_at:
              type:
              - string
              - 'null'
              format: date-time
            occurrences_created:
              type: integer
          readOnly: true
        plan:
          type:
          - object
          - 'null'
          properties:
            uuid:
              type: string
              format: uuid
            version:
              type: integer
            status:
              type: string
              enum:
              - pending_approval
              - approved
              - rejected
              - superseded
            body:
              type: string
            feedback:
              type: string
            approver_kind:
              type: string
              enum:
              - task_participants
              - merchant_of_record
            decided_by_name:
              type:
              - string
              - 'null'
            decided_at:
              type:
              - string
              - 'null'
              format: date-time
            created:
              type: string
              format: date-time
            viewer_can_decide:
              type: boolean
            versions:
              type: array
              items:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                  version:
                    type: integer
                  status:
                    type: string
                    enum:
                    - pending_approval
                    - approved
                    - rejected
                    - superseded
                  body:
                    type: string
                  feedback:
                    type: string
                  approver_kind:
                    type: string
                    enum:
                    - task_participants
                    - merchant_of_record
                  decided_by_name:
                    type:
                    - string
                    - 'null'
                  decided_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  created:
                    type: string
                    format: date-time
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignee
      - attachments
      - completed_at
      - created
      - created_by
      - modified
      - number
      - parent_task
      - plan
      - plan_awaiting_revision
      - recurrence_summary
      - requester
      - show_buyer_chat_notice
      - status_locked
      - subtasks
      - targets
      - title
      - unread_chat_count
      - unread_mention_count
      - uuid
      - watchers
    TaskPriorityEnum:
      enum:
      - low
      - medium
      - high
      - urgent
      type: string
      description: '* `low` - Low

        * `medium` - Medium

        * `high` - High

        * `urgent` - Urgent'
    _FleetInstallation:
      type: object
      properties:
        company:
          allOf:
          - $ref: '#/components/schemas/_CompanyRef'
        status:
          type: string
        installed_by:
          allOf:
          - $ref: '#/components/schemas/_UserRef'
        installed_at:
          type: string
          format: date-time
        shadow_user:
          allOf:
          - $ref: '#/components/schemas/_UserRef'
      required:
      - company
      - installed_at
      - installed_by
      - shadow_user
      - status
    AgentDetailError:
      type: object
      description: 'Common error envelope for the agents session endpoints — returns

        ``{"detail": "..."}`` on every non-2xx response.'
      properties:
        detail:
          type: string
      required:
      - detail
    AgentSession:
      type: object
      description: 'Read shape for the active AgentCore session pointer.


        Surfaces ``session_id`` plus ``last_used_at`` so the FE can decide

        whether a hydrated value is stale enough to warrant a fresh chat. We

        intentionally do not expose the row''s primary key — callers always

        address "the session for the current ``(user, company, agent_name)``"

        via the ``/me/`` endpoint, so a UUID lookup field would be dead weight.'
      properties:
        session_id:
          type: string
          readOnly: true
          description: Opaque AgentCore session id. Conversation pointer, not a secret — AgentCore enforces auth via the runtime JWT. Min length 33 chars (AgentCore SDK requirement); we mint as 'opply-{uuid4().hex}'.
        agent_name:
          type: string
          readOnly: true
          description: AgentCore runtime name (e.g. 'buyer-assistant').
        agent_version:
          type:
          - integer
          - 'null'
          readOnly: true
          description: Concrete AgentCore runtime version (integer) this session last ran on, resolved from the version channel at invoke time. null = legacy row, local dev, or a channel with no CDK-published version. Kept for later session cleanup/repair (e.g. drop sessions from a bad version).
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          description: Bumped on every invocation; lets us garbage-collect stale rows later.
      required:
      - agent_name
      - agent_version
