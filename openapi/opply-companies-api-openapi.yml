    MoRBuyerComplianceDocument:
      type: object
      description: 'Read shape for the MoR''s view of a buyer''s compliance documents.


        Same fields as the buyer-facing serializer (minus the write-only upload

        fields) plus the agent''s structured extraction detail when the document

        came through onboarding. Jurisdiction / certificate number / issuing

        authority are first-class ``BuyerDocument`` columns (also mirrored as

        text in ``notes``); the nested ``extraction`` payload additionally

        surfaces the agent-only fields that have no document column (e.g.

        ``compliance_type``, ``type_hint``, ``us_state``, ``evidence``).'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/DocumentType'
          readOnly: true
        file:
          type: string
          format: uri
          readOnly: true
          description: The uploaded document file
        name:
          type: string
          readOnly: true
          description: Display name for the document
        start_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Start date of document validity
        end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: End/expiry date of document validity
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
          readOnly: true
          description: ISO country codes this document applies to. Empty = all countries.
        certificate_number:
          type: string
          readOnly: true
          description: Permit / exemption / certificate number as printed on the document
        jurisdiction:
          type: string
          readOnly: true
          description: State/region the document applies in, as printed on the document (e.g. 'Michigan'). For US documents the structured counterpart is us_state_jurisdiction.
        us_state_jurisdiction:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/USStateEnum'
          - $ref: '#/components/schemas/BlankEnum'
        issuing_authority:
          type: string
          readOnly: true
          description: Body that issued the document (e.g. 'Michigan Department of Treasury')
        holder_name:
          type: string
          readOnly: true
          description: Entity the document is issued to as printed — normally the buyer company
        notes:
          type: string
          readOnly: true
          nullable: true
          description: Optional notes about this document
        status:
          allOf:
          - $ref: '#/components/schemas/DocumentLifecycleStatusEnum'
          readOnly: true
        is_archived:
          type: boolean
          description: Return whether the document is archived (expired or renewed).
          readOnly: true
        superseded_by_uuid:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        extraction:
          allOf:
          - $ref: '#/components/schemas/_ComplianceExtractionDetail'
          nullable: true
          readOnly: true
      required:
      - certificate_number
      - countries
      - created
      - end_date
      - extraction
      - file
      - holder_name
      - is_archived
      - issuing_authority
      - jurisdiction
      - modified
      - name
      - notes
      - start_date
      - status
      - superseded_by_uuid
      - type
      - us_state_jurisdiction
      - uuid
    PatchedBuyerSupplierPaymentTermsCreate:
      type: object
      properties:
        uuid:
          type: string
