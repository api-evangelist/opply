            * `NM` - New Mexico

            * `NY` - New York

            * `NC` - North Carolina

            * `ND` - North Dakota

            * `OH` - Ohio

            * `OK` - Oklahoma

            * `OR` - Oregon

            * `PA` - Pennsylvania

            * `RI` - Rhode Island

            * `SC` - South Carolina

            * `SD` - South Dakota

            * `TN` - Tennessee

            * `TX` - Texas

            * `UT` - Utah

            * `VT` - Vermont

            * `VA` - Virginia

            * `WA` - Washington

            * `WV` - West Virginia

            * `WI` - Wisconsin

            * `WY` - Wyoming

            * `DC` - District of Columbia

            * `PR` - Puerto Rico

            * `GU` - Guam

            * `VI` - U.S. Virgin Islands

            * `AS` - American Samoa

            * `MP` - Northern Mariana Islands'
          oneOf:
          - $ref: '#/components/schemas/USStateEnum'
          - $ref: '#/components/schemas/BlankEnum'
        issuing_authority:
          type: string
          description: Body that issued the document (e.g. 'Michigan Department of Treasury')
          maxLength: 255
        holder_name:
          type: string
          description: Entity the document is issued to as printed — normally the buyer company
          maxLength: 255
        notes:
          type: string
          nullable: true
          description: Optional notes about this document
          maxLength: 2048
        status:
          allOf:
          - $ref: '#/components/schemas/DocumentLifecycleStatusEnum'
          readOnly: true
        is_archived:
          type: boolean
          description: Return whether the document is archived (expired or renewed).
          readOnly: true
        superseded_by_uuid:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - file
      - is_archived
      - modified
      - name
      - status
      - superseded_by_uuid
      - type
      - uuid
    DocumentLifecycleStatusEnum:
