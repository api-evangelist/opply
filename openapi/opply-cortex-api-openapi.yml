components:
  schemas:
    CortexWorkflowCreate:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        input:
          type: string
        type:
          $ref: '#/components/schemas/CortexWorkflowTypeEnum'
        zendesk_ticket_id:
          type:
          - string
          - 'null'
          maxLength: 100
      required:
      - input
      - type
      - uuid
    PaginatedCortexJobList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CortexJob'
    PatchedCortexWorkflowWithJobs:
      type: object
      description: List all workflows with their associated jobs.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        input:
          type: string
        type:
          $ref: '#/components/schemas/CortexWorkflowTypeEnum'
        zendesk_ticket_id:
          type:
          - string
          - 'null'
          maxLength: 100
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/CortexJob'
          readOnly: true
        workFlowAlreadyHasFeedback:
          type: string
          readOnly: true
    CortexWorkflowTypeEnum:
      enum:
      - FINANCE
      - PREDICTIONS
      - COMPLIANCE
      - LOGISTICS
      - ORDERS
      type: string
      description: '* `FINANCE` - Finance

        * `PREDICTIONS` - Predictions

        * `COMPLIANCE` - Compliance

        * `LOGISTICS` - Logistics

        * `ORDERS` - Orders'
    CortexJobCreate:
      type: object
      description: Accepts a workflow by UUID for creation convenience.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        workflow_uuid:
          type: string
          format: uuid
          writeOnly: true
        agent_name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/CortexJobStatusEnum'
        job_index:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - agent_name
      - description
      - status
      - uuid
      - workflow_uuid
    CortexJobUpdate:
      type: object
      description: 'Partial updates: agent_name, description, status.'
      properties:
        agent_name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/CortexJobStatusEnum'
        job_index:
          type: integer
          maximum: 2147483647
          minimum: 0
    CortexJob:
      type: object
      description: Used for reading jobs (and nested under workflows).
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        workflow_uuid:
          type: string
          format: uuid
          readOnly: true
        workflow_type:
          type: string
          readOnly: true
        agent_name:
          type: string
        description:
          type: string
        job_index:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/CortexJobStatusEnum'
        status_last_updated:
          type:
          - string
          - 'null'
          format: date-time
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_name
      - created
      - description
      - modified
      - status
      - uuid
      - workflow_type
      - workflow_uuid
    PatchedCortexJobUpdate:
      type: object
      description: 'Partial updates: agent_name, description, status.'
      properties:
        agent_name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/CortexJobStatusEnum'
        job_index:
          type: integer
          maximum: 2147483647
          minimum: 0
    CortexWorkflowWithJobs:
      type: object
      description: List all workflows with their associated jobs.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        input:
          type: string
        type:
          $ref: '#/components/schemas/CortexWorkflowTypeEnum'
        zendesk_ticket_id:
          type:
          - string
          - 'null'
          maxLength: 100
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/CortexJob'
          readOnly: true
        workFlowAlreadyHasFeedback:
          type: string
          readOnly: true
      required:
      - created
      - input
      - jobs
      - modified
      - type
      - uuid
      - workFlowAlreadyHasFeedback
    PaginatedCortexWorkflowWithJobsList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CortexWorkflowWithJobs'
    CortexJobStatusEnum:
      enum:
      - PENDING
      - EXECUTING
      - COMPLETED
      - AWAITING_HUMAN
      type: string
      description: '* `PENDING` - Pending

        * `EXECUTING` - Executing

        * `COMPLETED` - Completed

        * `AWAITING_HUMAN` - Awaiting Human'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
