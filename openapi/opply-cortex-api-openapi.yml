      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CortexWorkflowWithJobs'
          description: ''
      summary: Api v1 cortex workflows partial update
      x-summary-source: derived
    delete:
      operationId: api_v1_cortex_workflows_destroy
      description: 'Endpoints:

        - POST /workflows/ -> create workflow (return UUID only)

        - GET /workflows/ -> list workflows, each with associated jobs'
      parameters:
      - in: path
        name: uuid
