        in-line dict the action builds is otherwise inferred as the ModelViewSet''s

        default serializer.'
      properties:
        email:
          type: boolean
        in_app:
          type: boolean
      required:
      - email
      - in_app
    CompanyNotificationOverride:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
