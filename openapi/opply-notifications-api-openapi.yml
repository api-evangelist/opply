  /api/v2/notifications/debug-dispatch/:
    post:
      operationId: api_v2_notifications_debug_dispatch_create
      description: '``POST /api/v2/notifications/debug-dispatch/``


        Body fields:

        - ``audience_type``: one of ``user`` / ``company`` / ``user_type`` / ``all``.

        - ``target_user_email`` (USER): the recipient''s email. Defaults to the caller.

        - ``target_company_uuid`` (COMPANY): the company to broadcast to. Defaults

        to the caller''s company.

        - ``user_type`` (USER_TYPE): brand / supplier / merchant_of_record.

        - ``kind_code``: NotificationKind to dispatch. Defaults to ``order_created``.

        - ``title_override``: optional string that the seeded kind''s title template

        renders in place of the order number — handy for spotting the row in the

        bell.'
      tags:
      - Notifications
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
      summary: Api v2 notifications debug dispatch create
      x-summary-source: derived
  /api/v2/notifications/me/:
    get:
      operationId: api_v2_notifications_me_list
      description: 'In-app inbox for the authenticated user.


        ``GET /api/v2/notifications/me/`` — paginated list of the user''s notifications.

        ``GET /api/v2/notifications/me/unread-count/`` — bell-badge count.

        ``POST /api/v2/notifications/me/{uuid}/read/`` — mark one as read.

        ``POST /api/v2/notifications/me/{uuid}/archive/`` — dismiss one.

        ``POST /api/v2/notifications/me/mark-all-read/`` — bulk-read every unread row.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
          enum:
          - all
          - unread
        description: '``unread`` hides READ rows (used by the bell popover); ``all`` (the default) returns both READ and unread rows for the full /notifications page. ARCHIVED rows are always excluded.'
      tags:
      - Notifications
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationRecipientList'
          description: ''
      summary: Api v2 notifications me list
      x-summary-source: derived
