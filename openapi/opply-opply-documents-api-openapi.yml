    OpplyDocumentBuyer:
      type: object
      description: 'Read-only serializer for buyers viewing Opply documents.


        Returns all documents (including archived) with computed status.'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/DocumentType'
          readOnly: true
        file:
          type: string
          format: uri
          readOnly: true
          description: The uploaded document file
        name:
          type: string
          readOnly: true
          description: Display name for the document
        start_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Start date of document validity
        end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: End/expiry date of document validity
        status:
          allOf:
          - $ref: '#/components/schemas/DocumentLifecycleStatusEnum'
          readOnly: true
        is_archived:
          type: boolean
          description: Return whether the document is archived (expired or renewed).
          readOnly: true
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
          readOnly: true
          description: ISO country codes this document applies to. Empty = all countries.
      required:
      - countries
      - end_date
      - file
      - is_archived
      - name
      - start_date
      - status
      - type
      - uuid
    OpplyDocument:
      type: object
      description: 'Serializer for OpplyDocument - for MoR users.


        Handles CRUD operations with computed status fields.'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        merchant_of_record:
          type: integer
          readOnly: true
          description: The Merchant of Record that owns this document
        type:
          allOf:
          - $ref: '#/components/schemas/DocumentType'
          readOnly: true
        type_uuid:
          type: string
          format: uuid
          writeOnly: true
        renewing_uuid:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        file:
          type: string
          format: uri
          description: The uploaded document file
        name:
          type: string
          description: Display name for the document
          maxLength: 255
        start_date:
          type: string
          format: date
          nullable: true
          description: Start date of document validity
        end_date:
          type: string
          format: date
          nullable: true
          description: End/expiry date of document validity
        status:
          allOf:
          - $ref: '#/components/schemas/DocumentLifecycleStatusEnum'
          readOnly: true
        is_archived:
          type: boolean
          description: Return whether the document is archived (expired or renewed).
          readOnly: true
        superseded_by_uuid:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
          description: ISO country codes this document applies to. Empty = all countries.
      required:
      - created
      - file
      - is_archived
      - merchant_of_record
      - modified
      - name
      - status
      - superseded_by_uuid
      - type
      - uuid
    DocumentType:
      type: object
      description: Shared serializer for the DocumentType taxonomy (buyer, supplier, Opply documents).
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
      required:
      - name
      - uuid
    PatchedOpplyDocument:
      type: object
      description: 'Serializer for OpplyDocument - for MoR users.


        Handles CRUD operations with computed status fields.'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        merchant_of_record:
          type: integer
          readOnly: true
          description: The Merchant of Record that owns this document
        type:
          allOf:
          - $ref: '#/components/schemas/DocumentType'
          readOnly: true
        type_uuid:
          type: string
          format: uuid
          writeOnly: true
        renewing_uuid:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        file:
          type: string
          format: uri
          description: The uploaded document file
        name:
          type: string
          description: Display name for the document
          maxLength: 255
        start_date:
          type: string
          format: date
          nullable: true
          description: Start date of document validity
        end_date:
          type: string
          format: date
          nullable: true
          description: End/expiry date of document validity
        status:
          allOf:
          - $ref: '#/components/schemas/DocumentLifecycleStatusEnum'
          readOnly: true
        is_archived:
          type: boolean
          description: Return whether the document is archived (expired or renewed).
          readOnly: true
        superseded_by_uuid:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
          description: ISO country codes this document applies to. Empty = all countries.
    PaginatedOpplyDocumentBuyerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/OpplyDocumentBuyer'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
