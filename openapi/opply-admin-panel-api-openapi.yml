components:
  schemas:
    ActivityTypeEnum:
      enum:
      - producer
      - distributor
      - importer_exporter
      - wholesaler
      - food_manufacturer
      - beverage_manufacturer
      - raw_mat_manufacturer
      - other
      type: string
      description: '* `producer` - Producer

        * `distributor` - Distributor

        * `importer_exporter` - Importer / Exporter

        * `wholesaler` - Wholesaler

        * `food_manufacturer` - Manufacturer of Finished Food Products

        * `beverage_manufacturer` - Manufacturer of Finished Beverage Products

        * `raw_mat_manufacturer` - Manufacturer of raw materials

        * `other` - Other'
    NumOfEmployeesEnum:
      enum:
      - 0 - 20
      - 21 - 100
      - 101 - 500
      - 500+
      type: string
      description: '* `0 - 20` - 0 - 20

        * `21 - 100` - 21 - 100

        * `101 - 500` - 101 - 500

        * `500+` - 500+'
    AdminCompany:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        website:
          type: string
          nullable: true
          maxLength: 255
        name:
          type: string
          maxLength: 255
        logo:
          type: string
          format: uri
          nullable: true
        industry:
          type: string
          nullable: true
          maxLength: 100
        kyb_status:
          type: string
          readOnly: true
        phone_number:
          type: string
          nullable: true
          maxLength: 50
        country:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
        company_type:
          $ref: '#/components/schemas/CompanyTypeEnum'
        product_type:
          type: array
          items:
            $ref: '#/components/schemas/ProductTypeEnum'
          default:
          - e
          - h
          - o
          - r
          - t
        activity_type:
          type: array
          items:
            $ref: '#/components/schemas/ActivityTypeEnum'
          default:
          - e
          - h
          - o
          - r
          - t
        registration_number:
          type: string
          nullable: true
          maxLength: 255
        registration_name:
          type: string
          nullable: true
          maxLength: 255
        mongo_id:
          type: string
          readOnly: true
          nullable: true
        referral_code:
          type: string
          readOnly: true
        phone_country_code:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PhoneCountryCodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        company_addresses:
          type: array
          items:
            $ref: '#/components/schemas/CompanyAddress'
        currency:
          type: string
          readOnly: true
        payout_method_type:
          type: string
          nullable: true
          description: rapyd payout method
          maxLength: 45
        bank_account_country:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Country'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        duns:
          type: string
          nullable: true
          description: DUNS number for creditworthiness checks and payouts
          maxLength: 50
        created:
          type: string
          format: date-time
          readOnly: true
        last_login:
          $ref: '#/components/schemas/LastLogin'
        product_category:
          type: array
          items:
            $ref: '#/components/schemas/ProductCategoryEnum'
          default:
          - e
          - h
          - o
          - r
          - t
        annual_turnover:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AnnualTurnoverEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        num_of_employees:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/NumOfEmployeesEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        num_of_skus:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/NumOfSkusEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        sku_ordering_enabled:
          type: boolean
        mov:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/MovEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_active:
          type: string
          readOnly: true
      required:
      - country
      - created
      - currency
      - id
      - is_active
      - kyb_status
      - last_login
      - mongo_id
      - name
      - referral_code
