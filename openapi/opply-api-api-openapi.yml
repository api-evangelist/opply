      - recommendations:write
      - zendesk:read
      - zendesk:write
      - unleashed:read
      type: string
      description: '* `all:read` - Read access to all MCP tools

        * `all:write` - Write access to all MCP tools

        * `orders:read` - Read order data

        * `orders:write` - Create and modify orders

        * `companies:read` - Read company and supplier data

        * `companies:write` - Modify company data

        * `crm:read` - Read CRM contacts and companies

        * `crm:write` - Modify CRM data

        * `catalog:read` - Read product catalog

        * `catalog:write` - Modify product catalog

        * `activities:read` - Read tasks and notes

        * `activities:write` - Create and modify tasks and notes

        * `tasks:read` - Read tasks assigned to the calling user

        * `tasks:write` - Update tasks, create subtasks, upload plans, complete agent runs

        * `payments:read` - Read payments and statements

        * `payments:write` - Record payments, payouts, refunds

        * `agreements:read` - Read agreements

        * `agreements:write` - Create and modify agreements

        * `onboarding:read` - Read onboarding workflows

        * `onboarding:write` - Modify onboarding workflows

        * `agents:read` - Read installable agents and their installation status

        * `agents:write` - Activate, pause, or revoke agent installations

        * `files:read` - Read tenant files the caller can already access via REST

        * `insights:read` - Read derived insight facts

        * `recommendations:read` - Read recommendations (nudges) and recent recipient actions

        * `recommendations:write` - Create, supersede, and retire recommendations

        * `zendesk:read` - Read Zendesk tickets, users, and search

        * `zendesk:write` - Create and update Zendesk tickets, comments, and tags

        * `unleashed:read` - Read Unleashed company, suppliers, warehouses, and purchase orders'
