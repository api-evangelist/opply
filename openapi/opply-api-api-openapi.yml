      type: object
      description: 'Agent write-path serializer (behind the ``create_recommendation`` MCP tool).


        **No ``impact_*`` field exists here** — impact is read from the cited insight

        at render time, so the agent can never write a money figure. The agent supplies

        ``kind`` (stored loosely; catalog lives in ``@opply/agent-protocol``) and

        ``audience`` (validated against the enum so the buyer feed''s audience filter is

        a real boundary). ``subject_company`` is stamped from ``request.user_company``.'
      properties:
        kind:
          type: string
          description: Recommendation type code (e.g. `supplier_concentration`). The catalog of kinds + their templates lives in `@opply/agent-protocol`; this column stores whatever the agent emits.
          maxLength: 64
        audience:
          allOf:
          - $ref: '#/components/schemas/RecommendationAudienceEnum'
          default: buyer
        title:
          type: string
          description: Agent-phrased headline.
          maxLength: 512
        description:
          type: string
          description: Agent-phrased body. No $ figure is stored here.
        evidence:
          type: string
          default: ''
          maxLength: 4000
        visual:
          oneOf:
          - type: object
            title: ShareVisual
            properties:
              type:
                type: string
                enum:
                - share
              a:
                type: number
                minimum: 0
                maximum: 100
              left:
                type: string
              right:
                type: string
            required:
            - type
            - a
            - left
            - right
          - type: object
            title: PairVisual
            properties:
              type:
                type: string
                enum:
                - pair
              a:
                type: object
                additionalProperties: true
              b:
                type: object
                additionalProperties: true
            required:
            - type
            - a
            - b
          - type: object
            title: NoVisual
            description: Empty object when the kind has no visual (visualType 'none').
            additionalProperties: false
        severity:
          allOf:
          - $ref: '#/components/schemas/RecommendationSeverityEnum'
          default: 1
        cta_label:
          type: string
          description: Optional CTA button label (agent-phrased).
          maxLength: 64
        cta_target:
          type: string
          description: Optional internal route the CTA navigates to (`/`-prefixed; validated FE-side).
          maxLength: 512
        rec_insights:
          type: array
          items:
            $ref: '#/components/schemas/_RecommendationInsightWrite'
