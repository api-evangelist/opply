        Backs the single per-provider "Disconnect" CTA on the connector card

        (the generic ``DELETE /integrations/plaid/`` returns 405 for resolver-backed

        connectors). Per-Item revoke lives at ``plaid/items/<uuid>/``.'
      tags:
