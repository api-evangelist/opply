    MessageAttachmentRef:
      type: object
      description: 'One attachment ref carried on a message''s ``metadata["attachments"]``

        (SC-4146). Channel-neutral and reusable by **any** message serializer (agent

        chat today; task chat / private notes next) — nest it with ``many=True,

        required=False`` so a message that carried no attachments omits the key.


        Read-only projection of the dicts written by

        :func:`~apps.files.services.message_attachments.resolve_and_gate_attachments`;

        carries no bytes / URL — the FE mints a short-TTL presigned URL from ``uuid``

        when it renders a preview. ``disposition``''s enum name is pinned via

        ``ENUM_NAME_OVERRIDES`` (``MessageAttachmentDispositionEnum``) so the shared

        component doesn''t collide in the generated OpenAPI schema.'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        filename:
          type: string
          readOnly: true
        mime:
          type: string
          readOnly: true
        disposition:
          allOf:
          - $ref: '#/components/schemas/MessageAttachmentDispositionEnum'
          readOnly: true
      required:
      - disposition
      - filename
      - mime
      - uuid
    McpAccessRequest:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Public identifier for this access request
        user_uuid:
          type: string
          format: uuid
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        requested_scopes:
          type: array
          items:
            $ref: '#/components/schemas/McpScopeKeyEnum'
        justification:
          type: string
          description: Brief explanation from the user of why they need MCP access
          maxLength: 500
        status:
          allOf:
          - $ref: '#/components/schemas/McpAccessRequestStatusEnum'
          readOnly: true
        review_note:
          type: string
          default: ''
        reviewed_by_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the admin reviewed this request
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - justification
      - requested_scopes
      - reviewed_at
      - reviewed_by_email
      - status
      - user_email
      - user_uuid
      - uuid
    AgentSession:
      type: object
      description: 'Read shape for the active AgentCore session pointer.


        Surfaces ``session_id`` plus ``last_used_at`` so the FE can decide

        whether a hydrated value is stale enough to warrant a fresh chat. We

        intentionally do not expose the row''s primary key — callers always

        address "the session for the current ``(user, company, agent_name)``"

        via the ``/me/`` endpoint, so a UUID lookup field would be dead weight.'
      properties:
        session_id:
          type: string
          readOnly: true
          description: Opaque AgentCore session id. Conversation pointer, not a secret — AgentCore enforces auth via the runtime JWT. Min length 33 chars (AgentCore SDK requirement); we mint as 'opply-{uuid4().hex}'.
        agent_name:
          type: string
          readOnly: true
          description: AgentCore runtime name (e.g. 'buyer-assistant').
        agent_version:
          type: integer
          readOnly: true
          nullable: true
          description: Concrete AgentCore runtime version (integer) this session last ran on, resolved from the version channel at invoke time. null = legacy row, local dev, or a channel with no CDK-published version. Kept for later session cleanup/repair (e.g. drop sessions from a bad version).
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          description: Bumped on every invocation; lets us garbage-collect stale rows later.
      required:
      - agent_name
      - agent_version
      - last_used_at
      - session_id
    HubSpotOwner:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      required:
      - email
      - first_name
      - id
      - last_name
