    AgentTokenRequest:
      type: object
      description: 'JSON body the agent runtime POSTs to ``agent-token``.


        The runtime passes the active turn''s ``company_uuid`` so the lookup

        targets the right tenant for multi-company users; absent means fall

        back to ``user.get_company()`` (the single-company case Opply assumes

        today).'
      properties:
        company_uuid:
          type: string
          format: uuid
    AgentSessionMessage:
      type: object
      description: 'One persisted conversation message in the chat transcript.


        Mirrors Strands'' ``MessageData`` shape (``{role, content}``) for the

        roles + content blocks we persist between turns: user + assistant

        messages, each carrying an array of native Bedrock content blocks

        (``{text}`` / ``{toolUse}`` / ``{toolResult}``). The agent''s per-turn

        handler restores its ``Agent.messages`` from the snapshot, projects

        each message through ``projectMessages`` /

        ``projectContentBlocks``, and emits the projection as a single

        ``messagesSnapshotEvent`` frame; Django picks that frame out and

        serialises it through this class.


        The FE walks ``content`` looking for ``toolUse`` + matching

        ``toolResult`` block pairs and renders one widget per pair via the

        agent-widgets registry; the live SSE path consumes the same block

        shape from Strands, so cold-load and live-stream rendering can''t

        drift.'
      properties:
        role:
          $ref: '#/components/schemas/AgentSessionMessageRoleEnum'
        content:
          type: array
          items:
            oneOf:
            - type: object
              required:
              - text
              properties:
                text:
                  type: string
            - type: object
              required:
              - toolUse
              properties:
                toolUse:
                  type: object
                  required:
                  - name
                  - toolUseId
                  properties:
                    name:
                      type: string
                    toolUseId:
                      type: string
                    input: {}
            - type: object
              required:
              - toolResult
              properties:
                toolResult:
                  type: object
                  required:
                  - toolUseId
                  - status
                  - content
                  properties:
                    toolUseId:
                      type: string
                    status:
                      type: string
                      enum:
                      - success
                      - error
                    content:
                      type: array
                      items:
                        oneOf:
                        - type: object
                          required:
                          - text
                          properties:
                            text:
                              type: string
                        - type: object
                          required:
                          - json
                          properties:
                            json: {}
          nullable: true
        timestamp:
          type: string
        moderation: {}
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MessageAttachmentRef'
      required:
      - content
      - role
    ConnectorVerifyResponse:
      type: object
      description: 'Coarse, closed-union result of the pre-flight token probe.


        Deliberately NOT the full ``ConnectorConnectionStatus`` set — the FE only

        needs to know whether the connection is usable, needs a reconnect, or is

        absent. Non-probed states (``pending`` / ``revoked`` / ``error``) are

        collapsed into one of these three before they leave the endpoint.'
      properties:
        status:
          $ref: '#/components/schemas/ConnectorVerifyResponseStatusEnum'
      required:
      - status
