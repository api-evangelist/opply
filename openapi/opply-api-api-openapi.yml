        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v2/notifications/preferences/categories/:
    get:
      operationId: api_v2_notifications_preferences_categories_list
      description: 'User-facing list of toggleable notification categories.


        Returns every non-``SYSTEM`` category that has at least one

        ``NotificationKind`` (registered in :data:`ALL_KINDS`) **relevant to

        the caller''s company type** — so the Settings page never renders a

        toggle the backend can''t act on, and never one for notifications the

        caller can''t receive. ``SYSTEM`` is always excluded: those kinds are

        mandatory and render as the FE''s "always-on" row, not a toggle.


        Company-type scoping is driven by ``NotificationKind.company_types``

        via ``applies_to_company_type``. Concretely today: a Merchant-of-Record

        caller sees ``TASKS`` and ``TASK_MENTIONS`` (the Tasks substrate is

        cross-company-type) but not ``UPDATES`` (ingredient uploads, supplier

        readiness, contract notices are buyer-only). A brand caller sees all

        three. Future MoR-only categories surface here for MoR callers the

        moment a kind scoped to them is registered.


        Each entry carries the user''s current per-channel state, derived from

        ``NotificationPreference`` rows (absent row = enabled).'
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryPreference'
          description: ''
  /api/v2/notifications/preferences/upsert/:
    put:
      operationId: api_v2_notifications_preferences_upsert_update
      description: 'Idempotent write for a single ``(category, channel)`` preference row.


        The viewset''s POST/PATCH pair require the caller to know the row''s

        primary key. The Settings UI doesn''t — it just wants "set EMAIL for

        ORDERS to disabled". This action collapses the lookup+write into one

        call and keeps the API surface clean on the FE side.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceUpsert'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceUpsert'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceUpsert'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
          description: ''
