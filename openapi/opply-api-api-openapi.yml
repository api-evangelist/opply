  /api/v1/integrations/{provider}/agent-token/:
    post:
      operationId: api_v1_integrations_agent_token_create
      description: 'Resolve a third-party access token for an agent runtime.


        Authenticated via the inbound agent JWT (audience

        ``opply-agents``). The subject (user vs company) is derived

        from ``ConnectorDefinition.kind`` — callers never specify it.


        The caller MAY send ``company_uuid`` in the JSON body; if so,

        we use that company after verifying the JWT user is an employee

        of it. If absent, we fall back to ``user.get_company()`` — the

        single-company case Opply assumes today. The check keeps the

        endpoint safe the day multi-company users return.


        Returns a structured ``status`` so the runtime can skip

        gracefully on missing / stale connections without parsing

        HTTP error codes. The token itself is never logged.'
      parameters:
      - in: path
        name: provider
        schema:
          type: string
          pattern: ^[a-z0-9_-]+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTokenRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenResponse'
          description: ''
        '401':
          description: Agent JWT present but invalid or expired.
        '403':
          description: Missing or malformed Authorization header (unauthenticated agent request).
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenErrorResponse'
          description: ''
  /api/v1/integrations/{provider}/callback/:
    get:
      operationId: integrations_callback
      description: OAuth callback. AgentCore Identity redirects the user's browser here after they complete consent on the third-party provider; we finalize the ConnectorConnection by calling verify and bounce the browser back to the FE settings page with a `result=` query string.
      parameters:
      - in: path
        name: provider
        schema:
          type: string
          pattern: ^[a-z0-9_-]+$
        required: true
      - in: query
        name: session_id
        schema:
          type: string
        description: The `sessionUri` returned by AgentCore Identity on initiate, sent back as a query param after consent.
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '302':
          description: Redirect to the FE integrations page.
        '405':
          description: Connector is admin-managed (DB-backed); OAuth lifecycle is disabled.
