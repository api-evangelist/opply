          application/json:
            schema:
              $ref: '#/components/schemas/OrderAdjustmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderAdjustmentCreate'
          multipart/form-data:
            schema:
