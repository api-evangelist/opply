  /api/v1/mcp/access-requests/:
    get:
      operationId: api_v1_mcp_access_requests_list
      description: 'Access request workflow.


        Admin:

        GET /api/v1/mcp/access-requests/ → pending requests for the company

        PATCH /api/v1/mcp/access-requests/{uuid}/ → approve or deny


        Member:

        POST /api/v1/mcp/access-requests/ → submit a request

        GET /api/v1/mcp/access-requests/ → own requests'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - MCP
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMcpAccessRequestList'
          description: ''
      summary: Api v1 mcp access requests list
      x-summary-source: derived
    post:
      operationId: api_v1_mcp_access_requests_create
      description: 'Access request workflow.


        Admin:

        GET /api/v1/mcp/access-requests/ → pending requests for the company

