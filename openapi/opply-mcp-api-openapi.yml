openapi: 3.2.0
info:
  title: Opply MCP API
  version: 0.0.0
tags:
- name: MCP
paths:
  /api/v1/mcp:
    post:
      operationId: api_v1_mcp_create
      description: 'MCP HTTP transport endpoint.


        Mounted at one path per server (``/api/v1/mcp/`` for the main Opply MCP,

        ``/api/v1/mcp/zendesk/``, ``/api/v1/mcp/unleashed/`` — see ``urls.py``); the

        ``server`` attribute set via ``as_view(server=...)`` selects which registry

        the route scopes tools to.


        POST — JSON-RPC request (initialize / tools/list / tools/call)

        DELETE — terminate session


        GET is intentionally not implemented (SSE streaming is not supported in PR 2).'
      tags:
      - MCP
      responses:
        '200':
          description: No response body
      summary: Api v1 mcp create
      x-summary-source: derived
    delete:
      operationId: api_v1_mcp_destroy
      description: 'MCP HTTP transport endpoint.


        Mounted at one path per server (``/api/v1/mcp/`` for the main Opply MCP,

        ``/api/v1/mcp/zendesk/``, ``/api/v1/mcp/unleashed/`` — see ``urls.py``); the

        ``server`` attribute set via ``as_view(server=...)`` selects which registry

        the route scopes tools to.


        POST — JSON-RPC request (initialize / tools/list / tools/call)

        DELETE — terminate session


        GET is intentionally not implemented (SSE streaming is not supported in PR 2).'
      tags:
      - MCP
      responses:
        '204':
          description: No response body
      summary: Api v1 mcp destroy
      x-summary-source: derived
