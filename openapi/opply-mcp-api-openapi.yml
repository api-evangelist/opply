        Member:

        POST /api/v1/mcp/access-requests/ → submit a request

        GET /api/v1/mcp/access-requests/ → own requests'
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpAccessRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/McpAccessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/McpAccessRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAccessRequest'
          description: ''
      summary: Api v1 mcp access requests create
      x-summary-source: derived
