    MerchantOfRecordAgreementOrderCreate:
      type: object
      description: "Place an order from a contract as the merchant of record.\n\nMirrors the buyer ``AgreementOrderCreateSerializer`` (delivery date + address\n+ per-line quantities), with two MoR-specific differences:\n\n- ``ordered_by_uuid`` — the MoR operator isn't the buyer, so the buyer\n  contact the order is placed on behalf of is supplied explicitly and must be\n  an employee of the contract's buyer company.\n- the delivery address is scoped to the contract's **buyer** company (not the\n  caller's company, which is the MoR).\n\nEverything else (prices, currencies, terms, shipping/fees, product details)\nis derived server-side from the contract by ``AgreementOrderCreationService``."
      properties:
        ordered_by_uuid:
          type: string
          format: uuid
        delivery_address_uuid:
          type: string
          format: uuid
          nullable: true
        delivery_date:
          type: string
          format: date
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/AgreementOrderLineItem'
        buyer_purchase_order_reference:
          type: string
          nullable: true
      required:
      - delivery_date
      - line_items
      - ordered_by_uuid
    AgreementLineItemDocumentUpload:
      type: object
      properties:
        file_name:
          type: string
          writeOnly: true
        category:
          $ref: '#/components/schemas/AgreementLineItemDocumentCategoryEnum'
      required:
      - category
      - file_name
    BlankEnum:
