    BuyerTwoCreditInformation:
      type: object
      description: 'Serializer for buyer''s Two credit summary.


        Monetary values are in cents in the buyer''s currency. total_credit and

        available_for_new_orders are null whenever status is not AVAILABLE —

        i.e. the buyer is not configured for Two, credit is revoked, or the

        upstream API is erroring.'
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/BuyerTwoCreditStatusEnum'
          description: 'Summary status: ''available'' (credit usable), ''not_configured'' (no Two integration), ''revoked'' (Two denied organic credit and recourse cannot compensate), or ''api_error'' (transient upstream failure — retry may succeed)


            * `available` - Available

            * `not_configured` - Not Configured

            * `revoked` - Revoked

            * `api_error` - API Error'
        currency:
          type: string
          nullable: true
          description: Currency code (e.g., 'GBP', 'EUR', 'USD')
        total_credit:
          type: integer
          nullable: true
          description: 'Total credit limit in cents (legacy additive model: Two organic + recourse, recourse capped by Allianz). The frontend reads this by default; switch to `max_total_credit` behind the credit-limit feature flag. Null when status != available.'
        available_for_new_orders:
          type: integer
          nullable: true
          description: Credit available for new orders in cents (legacy additive model). The frontend reads this by default; switch to `max_available_for_new_orders` behind the flag. Null when status != available.
        max_total_credit:
          type: integer
          nullable: true
          description: 'Total credit limit in cents under the shared-envelope model: the LARGER of the buyer''s Two organic or Allianz limit (not their sum). Null when status != available.'
        max_available_for_new_orders:
          type: integer
          nullable: true
          description: 'Credit available for new orders in cents under the shared-envelope model: max_total_credit minus all allocated orders (Two organic drawn first). UNCLAMPED — negative when the buyer is over their limit, so the finance card can show the full allocated amount and how much they are over by (mirrors the legacy available_for_new_orders). Null when status != available.'
        financial_document_count:
          type: integer
          description: Number of financial documents (P&L, balance sheet, management accounts) the buyer has on file.
      required:
      - available_for_new_orders
      - currency
      - financial_document_count
      - max_available_for_new_orders
      - max_total_credit
      - status
      - total_credit
