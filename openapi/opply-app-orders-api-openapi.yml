    BuyerPayableOverdueRef:
      type: object
      description: 'Lean reference to the oldest non-Two overdue payment.


        Returned alongside the summary so the buyer-app overdue banner can

        surface a one-click Pay Now CTA — the frontend deep-links to

        ``/nodes/payments?pay=<uuid>&kind=...&provider=...`` and the existing

        payments-page deep-link logic opens the drawer over the matching row.'
      properties:
