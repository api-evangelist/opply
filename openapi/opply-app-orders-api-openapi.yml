          type: string
        description: Case-insensitive substring match against the statement's own invoice_id (rendered as order_number=SF-XXXX in the response). Child-order PO-XXXX numbers are NOT searched here — those matches surface on the order rows of the merged Merchant-of-Record listing instead.
      - in: query
