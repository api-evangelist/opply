        supplier_tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          nullable: true
        supplier_unit_price_in_supplier_currency:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
