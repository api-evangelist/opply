    get:
      operationId: api_v1_app_orders_brand_payments_merchant_of_record_retrieve
      description: 'Returns service-fee statements **and** Stripe (MoR) orders in a single response, paginated independently. Used by the buyer app''s merged MoR table.


        The legacy `/payments/?provider=stripe` and `/payments/service-fees/` endpoints are unchanged — older consumers keep working.


        Filters apply to both halves of the response with the same semantics.'
      summary: Combined Merchant-of-Record payments listing
      parameters:
      - in: query
        name: due_date
        schema:
          type: string
        description: Filter by due month (YYYY-MM-01)
      - in: query
        name: limit
        schema:
          type: integer
        description: Number of merged rows per page (default 20)
      - in: query
        name: offset
        schema:
          type: integer
        description: Number of merged rows to skip (default 0)
      - in: query
        name: order_id
        schema:
          type: string
        description: Case-insensitive substring match against order_number. Order rows match their PO-XXXX number; statement rows match their own SF-XXXX invoice_id. A statement is NOT surfaced because one of its child orders matches — that match appears on the order row itself.
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (due, overdue, awaiting_reconciliation, paid)
      - in: query
        name: supplier
        schema:
          type: string
        description: Filter by supplier UUID. Applies to order rows only — service-fee statements are billed by Opply (not by a supplier) and are excluded from the response when this filter is set.
      - in: query
        name: transaction_type
        schema:
          type: string
          enum:
          - order
          - service_fee_invoice
        description: Restrict the merged list to one row kind. `order` returns only Stripe orders; `service_fee_invoice` returns only service-fee statements. Omit to include both.
      tags:
      - App Orders
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerMerchantOfRecordPaymentsListing'
          description: ''
        '400':
          description: Invalid filter or pagination parameter
