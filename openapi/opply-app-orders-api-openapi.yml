      description: 'Unified statements list: service-fee + Two (grouped) merged into one shape,

        with search, ordering and pagination applied across the *entire* MoR-scoped set

        (not a per-source page slice). Honors the same buyer / currency / month / type /

        tab filters as the individual list endpoints.'
      summary: MoR endpoints for Statements
      parameters:
      - in: query
        name: buyer_uuid
        schema:
          type: string
          format: uuid
        description: UUID of the buyer company (optional filter)
      - in: query
        name: currency
        schema:
          type: string
          enum:
          - EUR
          - GBP
          - USD
        description: Filter by currency
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -buyer_company__name
          - -due_date
          - -order_count
          - -statement_id
          - -subtotal
          - -total
          - -total_outstanding
          - buyer_company__name
          - due_date
          - order_count
          - statement_id
          - subtotal
          - total
          - total_outstanding
        description: 'Sort field: due_date (default), buyer_company__name, statement_id, subtotal, total, total_outstanding, order_count. Prefix with ''-'' to reverse.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive substring match on statement ID + buyer name. A numeric term also matches a statement whose total equals it exactly (major units, e.g. `1500` == 1500.00).
      - in: query
        name: statement_month
        schema:
          type: string
          format: date
        description: Filter by the month payment is due (YYYY-MM-DD). Filters on due_date.
      - in: query
        name: tab
        schema:
          type: string
          enum:
          - all
          - awaiting_reconciliation
          - cancelled
          - due
          - overdue
          - paid
          - pending
        description: 'Filter by tab: all, pending, due, overdue, paid, awaiting_reconciliation, cancelled'
      - in: query
        name: type
        schema:
          type: string
          enum:
          - service_fee
          - two
        description: Restrict to one statement source. Omit to include both.
      tags:
      - App Orders
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUnifiedStatementListList'
          description: ''
