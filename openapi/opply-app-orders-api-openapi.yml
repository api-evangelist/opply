    ProviderBankDetails:
      type: object
      properties:
        stripe:
          type: array
          items:
            $ref: '#/components/schemas/BankDetail'
        two:
          type: array
          items:
            $ref: '#/components/schemas/BankDetail'
      required:
      - stripe
      - two
    BuyerActivityStatementCurrency:
      type: object
      description: The statement for a single currency, with opening / closing balance.
      properties:
        currency:
          type: string
          readOnly: true
        opening_balance_cents:
          type: integer
          readOnly: true
        closing_balance_cents:
          type: integer
          readOnly: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/BuyerActivityStatementEntry'
          readOnly: true
      required:
      - closing_balance_cents
      - currency
      - entries
      - opening_balance_cents
    OtifDataDeliveryIssueTypeNested:
      type: object
      description: Nested serializer for delivery issue types in OTIF data.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - name
      - uuid
    ServiceFeeMismatch:
      type: object
      description: 'Shape of ``MerchantOfRecordAppOrderDetailsSerializer.service_fee_mismatch``

        (SC-3919). Present only when the order''s fee disagrees with its linked OM

        contract; ``null`` otherwise.'
      properties:
        order_percentage:
          type: number
          format: double
        expected_percentage:
          type: number
          format: double
          nullable: true
        reason:
          type: string
      required:
      - expected_percentage
      - order_percentage
      - reason
    CreditCalculatorResponse:
      type: object
      description: Response serializer for the credit calculator endpoint.
      properties:
        credit_check_required:
          type: boolean
          description: False for DIRECT orders (no credit check needed)
        amount_cents:
          type: integer
          nullable: true
          description: The amount checked against limits (cents)
        payment_provider:
          type: string
          nullable: true
          description: Payment provider used for the check
        buyer_currency:
          type: string
          nullable: true
          description: The buyer's currency code (e.g., 'GBP', 'EUR')
        limits:
          allOf:
          - $ref: '#/components/schemas/CreditCalculatorLimits'
          description: Credit limits by provider
        recommended_credit_risk_owner:
          nullable: true
          description: 'Recommended credit risk owner


            * `two` - Two

            * `allianz` - Allianz

            * `opply` - Opply'
          oneOf:
          - $ref: '#/components/schemas/CreditRiskOwnerEnum'
          - $ref: '#/components/schemas/NullEnum'
        empty_credit_risk_owner_total:
          type: integer
          description: Total allocated credit for orders with no credit risk owner (cents, visibility only)
        has_sufficient_credit:
          type: boolean
          nullable: true
          description: Whether any credit path can cover the amount (null if no amount)
        summary:
          allOf:
          - $ref: '#/components/schemas/CreditSummary'
          nullable: true
          description: Buyer credit summary (max envelope, available, source, over-limit); null for DIRECT orders.
      required:
      - amount_cents
      - buyer_currency
      - credit_check_required
      - empty_credit_risk_owner_total
      - has_sufficient_credit
      - limits
      - payment_provider
      - recommended_credit_risk_owner
    BuyerGroupedStatementDetail:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        statement_id:
          type: string
          readOnly: true
          description: Human-readable statement identifier (e.g. 2026-MAY-TWO-000042)
        merchant_of_record_company_name:
          type: string
          readOnly: true
        payment_provider:
          allOf:
          - $ref: '#/components/schemas/PaymentProviderEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/GroupedStatementStatusEnum'
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          description: Date by which payment is expected. Grouping key.
        currency:
          allOf:
          - $ref: '#/components/schemas/AvailableCurrenciesEnum'
          readOnly: true
        subtotal:
          type: integer
          readOnly: true
          description: Subtotal in cents (before tax). Sum of member orders' subtotals.
        tax:
          type: integer
          readOnly: true
          description: Tax amount in cents. Sum of member orders' tax.
        total:
          type: integer
          readOnly: true
          description: Total in cents (subtotal + tax). Sum of member orders' totals.
        total_outstanding:
          type: integer
          readOnly: true
          description: Outstanding amount in cents. total - sum(OrderPayment.amount_cents) across member orders. Recomputed on allocation events. No default — services creating a statement must set this explicitly (typically equal to `total` before any payments arrive).
        order_count:
          type: integer
          readOnly: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        external_payment_id:
          type: string
          readOnly: true
          nullable: true
          description: Payment reference copied from the provider's report. Used in reconciliation.
        orders:
          type: array
          items:
            $ref: '#/components/schemas/BuyerGroupedStatementOrder'
          readOnly: true
        bank_details:
          type: array
          items:
            $ref: '#/components/schemas/BankDetail'
          readOnly: true
      required:
      - bank_details
      - currency
      - due_date
      - external_payment_id
      - merchant_of_record_company_name
      - order_count
      - orders
      - paid_at
      - payment_provider
      - statement_id
      - status
      - subtotal
      - tax
      - total
      - total_outstanding
      - uuid
