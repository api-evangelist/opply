  /api/v1/app-orders/merchant-of-record/grouped-statements/:
    get:
      operationId: api_v1_app_orders_merchant_of_record_grouped_statements_list
      description: 'MoR-facing viewset for listing, retrieving, and patching grouped statements.


        GET   /merchant-of-record/grouped-statements/         — paginated list with filters

        GET   /merchant-of-record/grouped-statements/{uuid}/  — detail incl. nested orders

        PATCH /merchant-of-record/grouped-statements/{uuid}/  — edit external_payment_id only


        Warnings (`has_warning`, `warning_count`, `warnings`) are pure derived state: a

        warning surfaces whenever a dispatched Two order matching the statement''s

        grouping key is missing a `two_invoice_due_date`, and disappears as soon as

        Two''s `order.reconciliation.invoiced.v1` webhook populates that field (or an

        admin sets it). There is no acknowledge / dismiss endpoint.'
      summary: MoR endpoints for Grouped Statements
      parameters:
      - in: query
        name: buyer_uuid
        schema:
          type: string
          format: uuid
        description: UUID of the buyer company (optional filter)
      - in: query
        name: currency
        schema:
          type: string
          enum:
          - EUR
          - GBP
          - USD
        description: Filter by currency
      - in: query
        name: due_date_from
        schema:
          type: string
          format: date
        description: Filter by due_date >= this date (YYYY-MM-DD).
      - in: query
        name: due_date_to
        schema:
          type: string
          format: date
        description: Filter by due_date <= this date (YYYY-MM-DD).
      - in: query
        name: has_warning
        schema:
          type: boolean
        description: Filter to statements with at least one orphan order (`true`) or without (`false`). Omit to include both. Server-authoritative — agents should rely on this rather than client-side filtering of a page.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_provider
        schema:
          type: string
          enum:
          - direct
          - stripe
          - two
        description: Filter by payment provider
      - in: query
        name: tab
        schema:
          type: string
          enum:
          - awaiting_reconciliation
          - cancelled
          - due
          - overdue
          - paid
          - pending
        description: Filter by tab. 'pending' groups DUE + OVERDUE + AWAITING_RECONCILIATION.
      tags:
      - App Orders
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupedStatementListList'
          description: ''
  /api/v1/app-orders/merchant-of-record/grouped-statements/{uuid}/:
    get:
      operationId: api_v1_app_orders_merchant_of_record_grouped_statements_retrieve
      description: 'MoR-facing viewset for listing, retrieving, and patching grouped statements.


        GET   /merchant-of-record/grouped-statements/         — paginated list with filters

        GET   /merchant-of-record/grouped-statements/{uuid}/  — detail incl. nested orders

        PATCH /merchant-of-record/grouped-statements/{uuid}/  — edit external_payment_id only


        Warnings (`has_warning`, `warning_count`, `warnings`) are pure derived state: a

        warning surfaces whenever a dispatched Two order matching the statement''s

        grouping key is missing a `two_invoice_due_date`, and disappears as soon as

        Two''s `order.reconciliation.invoiced.v1` webhook populates that field (or an

        admin sets it). There is no acknowledge / dismiss endpoint.'
      summary: MoR endpoints for Grouped Statements
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
        required: true
      tags:
      - App Orders
      security:
