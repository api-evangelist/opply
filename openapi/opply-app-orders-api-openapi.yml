  /api/v1/app-orders/merchant-of-record/statements/summary/:
    get:
      operationId: api_v1_app_orders_merchant_of_record_statements_summary_retrieve
      description: 'Status-count summary (overdue / due / awaiting_reconciliation) over the merged

        service-fee + Two statement set, plus the per-currency Outstanding money total

        (Two/grouped only, one bucket per currency, never summed across currencies).

        Honors buyer / currency / month / type filters, ignores the tab, and is computed

        over the full filtered set (never a page slice). An optional `status` narrows only

        the Outstanding total (not the counts) so the card can track the list''s Status filter.'
      summary: MoR endpoints for Statements
      parameters:
      - in: query
        name: buyer_uuid
        schema:
          type: string
          format: uuid
        description: UUID of the buyer company (optional filter)
      - in: query
        name: currency
        schema:
          type: string
          enum:
          - EUR
          - GBP
          - USD
        description: Filter by currency
      - in: query
        name: statement_month
        schema:
          type: string
          format: date
        description: Filter by the month the payment is due (YYYY-MM-DD). Filters on due_date.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - awaiting_reconciliation
          - due
          - overdue
        description: Narrow the Outstanding total to a single status (due / overdue / awaiting_reconciliation) so the card matches the list's Status filter. The status counts always cover the full pending set regardless.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - service_fee
          - two
        description: Restrict to one statement source. Omit to count both.
      tags:
      - App Orders
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementSummary'
          description: ''
