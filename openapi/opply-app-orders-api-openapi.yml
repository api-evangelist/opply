      description: 'Returns the buyer''s Two credit summary. The `status` field signals which of four conditions applies: `available` (totals populated), `not_configured` (buyer has no Two integration), `revoked` (Two denied credit and recourse cannot compensate), or `api_error` (transient upstream failure — retry may succeed). When status is not `available`, all credit figures are null. `total_credit` / `available_for_new_orders` are the legacy additive model (Two organic + recourse) the frontend shows by default. `max_total_credit` is the shared-envelope limit — the LARGER of the Two organic or Allianz limit (not their sum). `max_available_for_new_orders` is that limit minus all allocated orders (Two organic drawn first), UNCLAMPED — negative when the buyer is over their limit, so the finance card can show the over-by amount. The frontend switches to the `max_*` fields behind the credit-limit feature flag. Monetary values are in cents.'
