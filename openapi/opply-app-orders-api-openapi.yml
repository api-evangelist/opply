        `MerchantOfRecordNestedOrderAdjustmentSerializer`, which adds

        `supplier_document_url`.


        Cross-order links are exposed via `originating_order_uuid` / `_number` and

        `applied_to_order_uuid` / `_number` so the FE can render "Order #5734-…"

        references without resolving the FKs separately.'
