        value:
          type: string
      required:
      - label
      - value
    MerchantOfRecordNestedOrderAdjustment:
      type: object
      description: 'MoR variant of the nested order-detail adjustment payload — adds

        `supplier_document_url`, which the buyer surface must not expose.


        Subclassing rather than sharing keeps the buyer / MoR contracts independent:

        adding a future MoR-only field here won''t accidentally leak to buyers.'
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/OrderAdjustmentTypeEnum'
          readOnly: true
          description: 'CREDIT_NOTE reduces the buyer''s amount due; DEBIT_NOTE adds an additional charge to the buyer


            * `credit_note` - Credit Note

            * `debit_note` - Debit Note'
        status:
          allOf:
          - $ref: '#/components/schemas/OrderAdjustmentStatusEnum'
          readOnly: true
        base_amount:
          type: integer
          readOnly: true
          description: Pre-tax adjustment amount in cents
        tax_amount:
          type: integer
          readOnly: true
          description: Tax amount in cents
        total_amount:
          type: integer
          readOnly: true
          description: Total in cents (base_amount + tax_amount); always positive — type indicates direction
        currency:
          allOf:
          - $ref: '#/components/schemas/AvailableCurrenciesEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
          nullable: true
          description: MoR-entered reason for the adjustment (internal/audit). Required for source=MANUAL; null for WEBHOOK / BACKFILL rows.
        originating_order_uuid:
          type: string
          format: uuid
          readOnly: true
        originating_order_number:
          type: string
          readOnly: true
        applied_to_order_uuid:
          type: string
          format: uuid
          readOnly: true
        applied_to_order_number:
          type: string
          readOnly: true
        applied_to_invoice_id:
          type: string
          readOnly: true
          nullable: true
          description: Provider invoice ID at apply time (snapshotted)
        provider_document_pdf_url:
          type: string
          readOnly: true
          nullable: true
          description: Cached PDF URL from the provider; refresh via API as needed
        pending_application_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        supplier_document_url:
          type: string
          format: uri
          readOnly: true
      required:
      - applied_at
      - applied_to_invoice_id
      - applied_to_order_number
      - applied_to_order_uuid
      - base_amount
      - created_at
      - currency
      - originating_order_number
      - originating_order_uuid
      - pending_application_at
      - provider_document_pdf_url
      - reason
      - status
      - supplier_document_url
      - tax_amount
      - total_amount
      - type
      - uuid
    PaginatedSupplierAppOrderListList:
      type: object
