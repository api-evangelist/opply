components:
  schemas:
    PaginatedHubSpotSyncRunListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/HubSpotSyncRunList'
    EnrichmentRunDetail:
      type: object
      description: Detail representation for the enrichment run history endpoint.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        view_uuid:
          type: string
          format: uuid
          readOnly: true
        process_name:
          allOf:
          - $ref: '#/components/schemas/EnrichmentProcessNameEnum'
          description: 'Which enrichment process to run


            * `icp_scoring` - ICP Scoring

            * `company_employee_data` - Company Employee Data

            * `contact_enrichment` - Contact Enrichment'
        status:
          $ref: '#/components/schemas/CrmImportRunStatusEnum'
        total_companies:
          type: integer
          maximum: 2147483647
          minimum: 0
        processed_companies:
          type: integer
          maximum: 2147483647
          minimum: 0
        progress_percent:
          type: number
          format: double
          readOnly: true
        triggered_by_uuid:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type: string
        started_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - created
      - process_name
      - progress_percent
      - triggered_by_uuid
      - uuid
      - view_uuid
    HubSpotSyncStatusEnum:
      enum:
      - pending
      - synced
      - failed
      - not_found
      type: string
      description: '* `pending` - Pending

        * `synced` - Synced

        * `failed` - Failed

        * `not_found` - Not Found'
    EnrichmentProcessNameEnum:
      enum:
      - icp_scoring
      - company_employee_data
      - contact_enrichment
      type: string
