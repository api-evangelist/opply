  /api/v1/crm/companies/import-file/:
    post:
      operationId: api_v1_crm_companies_import_file_create
      description: 'Upload a JSON file and import companies asynchronously using the matching strategy.


        Accepts multipart form data with:

        - file: the JSON file

        - schema: one of the CrmImportSchema values — determines which import strategy to use

        - source: one of the CrmCompanySource values — stored on each imported company record


        Returns a task_id that can be used to poll import-file/status/{task_id}/.'
